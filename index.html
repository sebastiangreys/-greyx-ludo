<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f1e6" />
<title>Ludo Greyx</title>
<style>
:root {
  --paper:#f7f1e6;
  --ink:#202b3e;
  --muted:#748091;
  --navy:#49668f;
  --coral:#e53935;
  --green:#368f60;
  --yellow:#d9a928;
  --blue:#426ba8;
  --safe:#b6914e;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
  min-width:320px;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%, #5141a833 0, transparent 28%),
    radial-gradient(circle at 85% 80%, #d64e4330 0, transparent 30%),
    linear-gradient(145deg,#0b0d17,#141827 55%,#0d101b);
  color:#f7f1e6;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
button {
  font:inherit;
}

.app {
  min-height:100vh;
}
.shell {
  position:relative;
  width:min(1180px,calc(100% - 36px));
  min-height:100vh;
  margin:auto;
  padding:24px 0 50px;
}
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  position:relative;
  z-index:5;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-logo {
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  border-radius:13px;
  background:#050505;
  color:#fff;
  overflow:hidden;
}
.brand-logo svg {
  width:31px;
  height:31px;
}
.brand-name {
  display:block;
  font-size:1.12rem;
  font-weight:850;
  letter-spacing:-.05em;
  line-height:1;
}
.brand-caption {
  display:block;
  margin-top:5px;
  color:var(--muted);
  font:600 .67rem/1 monospace;
  letter-spacing:.11em;
  text-transform:uppercase;
}
.setup {
  display:grid;
  grid-template-columns:1fr minmax(360px,530px);
  align-items:center;
  gap:clamp(46px,8vw,130px);
  min-height:650px;
}
.setup-modern {
  position:relative;
  min-height:680px;
  grid-template-columns:minmax(0,1fr) minmax(390px,500px);
  gap:clamp(50px,8vw,120px);
}

.setup-modern::before {
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  left:-180px;
  bottom:-180px;
  border-radius:50%;
  background:#7b61ff18;
  filter:blur(10px);
  pointer-events:none;
}

.setup-copy {
  position:relative;
  z-index:2;
  animation:menuCopyIn .65s ease-out both;
}

.setup-modern .eyebrow {
  color:#9f91ff;
}

.setup-modern .eyebrow::before {
  background:#7b61ff;
}

.setup-title {
  color:#fff;
  text-transform:uppercase;
  text-shadow:0 10px 35px #00000040;
}

.setup-title span {
  display:block;
  color:#8c7cff;
  letter-spacing:-.11em;
}

.setup-title-small {
  font-size:clamp(3.2rem,6vw,5.5rem);
}

.setup-lead {
  color:#aeb5c7;
}

.setup-status {
  display:inline-flex;
  align-items:center;
  gap:9px;
  margin-top:34px;
  padding:9px 13px;
  border:1px solid #ffffff12;
  border-radius:999px;
  background:#ffffff08;
  color:#8992a7;
  font:700 .64rem/1 monospace;
  letter-spacing:.1em;
}

.status-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:#62d891;
  box-shadow:0 0 12px #62d891;
}

.setup-card-modern {
  position:relative;
  overflow:hidden;
  border:1px solid #ffffff12;
  background:
    linear-gradient(145deg,#1d2232ee,#121622f2);
  box-shadow:
    0 30px 80px #00000055,
    inset 0 1px 0 #ffffff0b;
  border-radius:30px;
  padding:30px;
  color:#fff;
  animation:menuCardIn .65s .08s ease-out both;
}

.setup-card-modern::before {
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  right:-110px;
  top:-110px;
  border-radius:50%;
  background:#7b61ff20;
  filter:blur(4px);
}

.setup-card-glow {
  position:absolute;
  width:120px;
  height:120px;
  left:-70px;
  bottom:-70px;
  border-radius:50%;
  background:#d64e4318;
  filter:blur(8px);
}

.setup-card-header {
  position:relative;
  z-index:2;
  margin-bottom:22px;
}

.setup-card-kicker {
  display:block;
  margin-bottom:8px;
  color:#8f83ef;
  font:800 .62rem/1 monospace;
  letter-spacing:.16em;
}

.setup-card-modern h2 {
  margin:0;
  color:#fff;
  font-size:1.65rem;
  letter-spacing:-.05em;
}

.setup-card-modern .setup-card-header p {
  margin:7px 0 0;
  color:#8e97aa;
}

.mode-grid {
  position:relative;
  z-index:2;
  display:grid;
  gap:11px;
}

.mode-card {
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  min-height:76px;
  padding:13px;
  border:1px solid #ffffff0e;
  border-radius:18px;
  background:#ffffff06;
  color:#fff;
  text-align:left;
  cursor:pointer;
  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.mode-card:hover {
  transform:translateY(-2px);
  background:#ffffff0c;
  border-color:#8c7cff55;
}

.mode-card.selected {
  border-color:#8c7cff99;
  background:linear-gradient(100deg,#8c7cff18,#ffffff08);
  box-shadow:0 8px 25px #00000022;
}

.mode-icon {
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:14px;
  background:#ffffff0a;
  font-size:22px;
}

.mode-info {
  display:flex;
  flex:1;
  flex-direction:column;
  gap:4px;
}

.mode-info strong {
  font-size:.94rem;
}

.mode-info small {
  color:#858fa4;
  font-size:.69rem;
  line-height:1.35;
}

.mode-arrow {
  color:#737d92;
  font-size:25px;
}

.setup-divider {
  height:1px;
  margin:22px 0 15px;
  background:#ffffff0b;
}

.setup-footer {
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#727c90;
  font-size:.7rem;
}

.sound-mini {
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border:1px solid #ffffff10;
  border-radius:11px;
  background:#ffffff07;
  color:#fff;
  cursor:pointer;
  transition:.2s;
}

.sound-mini:hover {
  background:#ffffff12;
  transform:scale(1.05);
}

.player-count-grid {
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:25px 0;
}

.player-count-card {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:115px;
  border:1px solid #ffffff0d;
  border-radius:18px;
  background:#ffffff06;
  color:#fff;
  cursor:pointer;
  transition:.2s ease;
}

.player-count-card:hover {
  transform:translateY(-3px);
  border-color:#8c7cff55;
}

.player-count-card.selected {
  border-color:#8c7cff99;
  background:#8c7cff18;
  box-shadow:0 8px 25px #00000022;
}

.player-count-card strong {
  font-size:2.2rem;
  line-height:1;
}

.player-count-card span {
  margin-top:9px;
  color:#7e889c;
  font:700 .58rem/1 monospace;
  letter-spacing:.08em;
}

.setup-actions {
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:10px;
  margin-top:24px;
}

.secondary-button {
  min-height:52px;
  padding:0 18px;
  border:1px solid #ffffff14;
  border-radius:15px;
  background:#ffffff07;
  color:#aab1c0;
  font-weight:750;
  cursor:pointer;
  transition:.2s;
}

.secondary-button:hover {
  background:#ffffff0d;
  color:#fff;
}

.setup-card-modern .primary-button {
  min-height:52px;
  background:#7b68e8;
  box-shadow:0 5px 0 #4d429b;
}

.setup-card-modern .primary-button:hover {
  background:#8978f5;
}

.name-list {
  position:relative;
  z-index:2;
  display:grid;
  gap:9px;
}

.name-field {
  display:flex;
  align-items:center;
  gap:11px;
  min-height:58px;
  padding:9px 12px;
  border:1px solid #ffffff0d;
  border-radius:15px;
  background:#ffffff06;
}

.name-color,
.color-preview {
  flex:0 0 auto;
  border-radius:50%;
}

.name-color {
  width:13px;
  height:13px;
}

.name-field-content {
  display:flex;
  flex:1;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.name-field-content > span {
  color:#c5cad5;
  font-size:.78rem;
  font-weight:750;
}

.name-field input {
  width:50%;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  text-align:right;
  font:600 .78rem inherit;
}

.name-field input::placeholder {
  color:#596275;
}

.color-grid {
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-bottom:12px;
}

.color-card {
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border:1px solid #ffffff0d;
  border-radius:15px;
  background:#ffffff06;
  color:#fff;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.color-card:hover {
  transform:translateY(-2px);
  border-color:#ffffff25;
}

.color-card.selected {
  border-color:#8c7cff99;
  background:#8c7cff15;
}

.color-preview {
  width:29px;
  height:29px;
  box-shadow:inset 0 2px 3px #ffffff66,0 3px 8px #00000035;
}

.color-card strong,
.color-card small {
  display:block;
}

.color-card strong {
  font-size:.78rem;
}

.color-card small {
  margin-top:3px;
  color:#737d91;
  font-size:.6rem;
}

.solo-name-field {
  position:relative;
  z-index:2;
  margin-top:10px;
}

@keyframes menuCopyIn {
  from {
    opacity:0;
    transform:translateX(-18px);
  }
  to {
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes menuCardIn {
  from {
    opacity:0;
    transform:translateY(18px) scale(.98);
  }
  to {
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
.eyebrow {
  display:flex;
  align-items:center;
  gap:9px;
  color:#976d32;
  font:700 .7rem/1 monospace;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.eyebrow::before {
  content:"";
  width:24px;
  height:2px;
  background:#e4ac42;
}
h1,
h2,
h3,
p {
  margin-top:0;
}
.setup-title {
  margin:20px 0 23px;
  max-width:650px;
  font-size:clamp(4.2rem,8vw,7.4rem);
  line-height:.82;
  letter-spacing:-.1em;
}
.setup-title em {
  color:var(--coral);
  font-style:normal;
}
.setup-lead {
  max-width:500px;
  color:#687384;
  font-size:clamp(1rem,1.35vw,1.2rem);
  line-height:1.55;
}
.setup-note {
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:36px;
  color:#67717c;
  font-size:.82rem;
}
.setup-card,
.panel {
  border:1px solid #e5dfd3;
  background:#fffdf9ed;
  box-shadow:0 22px 50px #6c58301c;
  border-radius:26px;
}
.setup-card {
  position:relative;
  overflow:hidden;
  padding:38px;
}
.setup-card::after {
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  right:-57px;
  top:-83px;
  border-radius:50%;
  background:#fff2c7;
}
.setup-card>* {
  position:relative;
  z-index:1;
}
.setup-card h2 {
  margin-bottom:8px;
  font-size:1.7rem;
  letter-spacing:-.05em;
}
.setup-card p {
  color:var(--muted);
  font-size:.9rem;
}
.player-options {
  display:grid;
  gap:10px;
  margin:27px 0 20px;
}
.player-option {
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:15px 17px;
  border:1px solid #e5dfd3;
  border-radius:16px;
  background:#fbf7ed;
  color:var(--ink);
  text-align:left;
  cursor:pointer;
  transition:.2s;
}
.player-option:hover {
  transform:translateY(-2px);
  border-color:#cda83c;
}
.player-option.selected {
  border:2px solid #d5aa3d;
  padding:14px 16px;
  box-shadow:0 7px 18px #b1872020;
}
.player-option strong,
.player-option small {
  display:block;
}
.player-option strong {
  font-size:.98rem;
}
.player-option small {
  margin-top:4px;
  color:var(--muted);
  font-size:.72rem;
}
.dots {
  display:flex;
  gap:5px;
}
.dot,
.score-dot {
  display:inline-block;
  border-radius:50%;
}
.dot {
  width:12px;
  height:12px;
  border:1px solid #fff;
  box-shadow:0 1px 2px #0003;
}
.red {
  background:var(--coral);
}
.green {
  background:var(--green);
}
.yellow {
  background:var(--yellow);
}

.blue {
  background:var(--blue);
}
.primary-button,
.roll-button {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  width:100%;
  min-height:52px;
  border:0;
  border-radius:15px;
  background:var(--navy);
  color:#fff;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 4px 0 #304868;
  transition:.15s;
}
.primary-button:hover,
.roll-button:hover {
  filter:brightness(1.08);
  transform:translateY(-1px);
}
.mini-board {
  position:fixed;
  bottom:26px;
  left:25%;
  display:grid;
  grid-template-columns:repeat(3,29px);
  gap:5px;
  padding:14px;
  border-radius:22px;
  background:#e5c87c;
  transform:rotate(3deg);
  opacity:.78;
}
.mini-board i {
  display:block;
  width:29px;
  height:29px;
  border-radius:10px;
  background:#f7edca;
}
.mini-board i:nth-child(1) {
  background:#f5bdca;
}
.mini-board i:nth-child(2) {
  background:#b6e3df;
}
.mini-board i:nth-child(3) {
  background:#c8d7ed;
}
.mini-board i:nth-child(4) {
  background:#c9d7ee;
}
.mini-board i:nth-child(5) {
  background:#fff3cf;
}
.mini-board i:nth-child(6) {
  background:#efd8a0;
}
.mini-board i:nth-child(7) {
  background:#f7edca;
}
.mini-board i:nth-child(8) {
  background:#d6ae44;
}
.mini-board i:nth-child(9) {
  background:#f7edca;
}
.game-intro {
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:18px;
}
.game-intro h1 {
  margin:0;
  font-size:clamp(2rem,4vw,3.1rem);
  letter-spacing:-.08em;
}
.game-intro p {
  margin:8px 0 0;
  color:var(--muted);
  font-size:.9rem;
}
.turn-chip {
  display:flex;
  align-items:center;
  gap:9px;
  padding:11px 16px;
  border:1px solid #e1d9cb;
  border-radius:999px;
  color:var(--ink);
  background:#fffaf0;
  font:800 .72rem monospace;
  white-space:nowrap;
  box-shadow:0 4px 12px #6c583018;
  transition:
    background .25s ease,
    border-color .25s ease,
    transform .25s ease;
}
.turn-chip::before {
  content:"";
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--coral);
  box-shadow:
  0 0 0 4px #e5393520;
  animation:turnPulse 1.5s ease-in-out infinite;
}
.turn-chip.red-turn::before {
  background:var(--coral);
  box-shadow:0 0 0 4px #e5393520;
}
.turn-chip.green-turn::before {
  background:var(--green);
  box-shadow:0 0 0 4px #368f6020;
}
.turn-chip.yellow-turn::before {
  background:var(--yellow);
  box-shadow:0 0 0 4px #d9a92820;
}
.turn-chip.blue-turn::before {
  background:var(--blue);
  box-shadow:0 0 0 4px #426ba820;
}
@keyframes turnPulse {
  50% {
    transform:scale(1.18);
    box-shadow:
      0 0 0 7px ##e5393512;
  }
}
.game-layout {
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:clamp(18px,3vw,42px);
  align-items:start;
}

.board-wrap {
  min-width:0;
}

.board-frame {
  padding:9px;
  border:1px solid #c4a35e;
  border-radius:25px;
  background:#d8b86f;
  box-shadow:0 21px 35px #7d5d2028;
}

.board {
  display:grid;
  position:relative;
  overflow:hidden;
  aspect-ratio:1;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  border-radius:18px;
  background:#f8edcf;
}

.cell {
  position:relative;
  display:grid;
  place-items:center;
  border:1px solid #e8dcc1;
}

.cell.track {
  background:#fff9e7;
}

.cell.lane-red {
  background:#e98b7e;
}

.cell.lane-green {
  background:#80c398;
}

.cell.lane-yellow {
  background:#eed17b;
}

.cell.lane-blue {
  background:#8ca9d6;
}

.cell.start-red {
  background:#f2b1a7;
}

.cell.start-green {
  background:#a9d9b8;
}

.cell.start-yellow {
  background:#f4e3a8;
}

.cell.start-blue {
  background:#bbcbeb;
}

.cell.safe::before {
  content:"★";
  color:#b6914e;
  font-size:clamp(10px,1.4vw,17px);
}
.finish {
  position:absolute;
  z-index:2;

  width:20%;
  height:20%;
  left:40%;
  top:40%;

  display:grid;
  place-items:center;
  overflow:hidden;

  border:1px solid #b89950;
  border-radius:6px;

  background:conic-gradient(
    from 45deg,
    var(--coral) 0 25%,
    var(--yellow) 25% 50%,
    var(--blue) 50% 75%,
    var(--green) 75%
  );

  transform:none;
}

.finish::after {
  content:"";
  width:38%;
  height:38%;
  border-radius:50%;
  background:#fff8da;
  box-shadow:0 0 0 2px #c19e4e;
}

/* =====================================================
   CASAS
   ORDEN FINAL:
   ROJO   = ARRIBA IZQUIERDA
   AZUL   = ARRIBA DERECHA
   VERDE  = ABAJO IZQUIERDA
   AMARILLO = ABAJO DERECHA
   ===================================================== */

.home {
  position:absolute;
  z-index:3;
  display:grid;
  place-items:center;
  padding:7%;
  border-radius:10%;
}

/* Arriba izquierda */
.home.red {
  inset:0 60% 60% 0;
  background:#df6d62;
}

/* Arriba derecha */
.home.blue {
  inset:0 0 60% 60%;
  background:#7191c5;
}

/* Abajo izquierda */
.home.green {
  inset:60% 60% 0 0;
  background:#63aa7d;
}

/* Abajo derecha */
.home.yellow {
  inset:60% 0 0 60%;
  background:#eac34f;
}

.yard {
  display:grid;
  grid-template:repeat(2,1fr)/repeat(2,1fr);
  gap:11%;
  width:100%;
  height:100%;
  padding:13%;
  border-radius:12%;
  background:#fff8decc;
  box-shadow:inset 0 0 0 1px #76551e22;
}

.token {
  position:absolute;
  z-index:6;
  display:grid;
  place-items:center;

  width:76%;
  height:76%;
  left:12%;
  top:12%;

  border:2px solid #ffffffdd;
  border-radius:50%;

  color:#fff;
  font:800 clamp(7px,1vw,12px) monospace;

  cursor:default;

  background:
    radial-gradient(
      circle at 32% 27%,
      #ffffffaa 0 9%,
      transparent 10%
    ),
    radial-gradient(
      circle at 50% 55%,
      #ffffff22 0 35%,
      transparent 36%
    ),
    currentColor;

  box-shadow:
    inset 0 2px 3px #ffffff80,
    inset 0 -4px 5px #00000030,
    0 3px 0 #4d321f55,
    0 5px 9px #4d321f40;

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
}

.token.red {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#f58b80,#c94338);
}

.token.green {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#63b986,#27784e);
}

.token.yellow {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#f4d66a,#c39319);
}

.token.blue {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#7198d2,#31588f);
}

.yard .token {
  position:relative;
  width:100%;
  height:100%;
  left:auto;
  top:auto;
}

.token.valid {
  cursor:pointer;
  outline:3px solid #fffbe4;
  outline-offset:4px;

  animation:selectablePiece 1s ease-in-out infinite;

  filter:brightness(1.12);

  transform:translateY(-4px) scale(1.08);

  box-shadow:
    0 0 0 6px #fff9dc88,
    inset 0 2px 3px #ffffff80,
    inset 0 -4px 5px #00000030,
    0 7px 0 #4d321f55,
    0 11px 15px #4d321f45;
}

.token.valid:hover {
  transform:translateY(-7px) scale(1.16);
  filter:brightness(1.2);
}

.token.valid:active {
  transform:translateY(0) scale(.92);
}

  box-shadow:
    0 0 0 5px #fff9dc66,
    inset 0 2px 3px #ffffff80,
    inset 0 -4px 5px #00000030,
    0 6px 0 #4d321f55,
    0 9px 13px #4d321f40;
}

.token.valid:hover {
  transform:translateY(-5px) scale(1.13);
  filter:brightness(1.18);
}

.token.valid:active {
  transform:translateY(0) scale(.94);
  transition:transform .08s ease;
}
@keyframes selectablePiece {
  0%,100% {
    transform:translateY(-3px) scale(1.05);
  }

  50% {
    transform:translateY(-6px) scale(1.1);
  }
}
.token:disabled {
  opacity:1;
}

.token.finished {
  background:
    radial-gradient(circle at 32% 27%,#ffffffaa 0 9%,transparent 10%),
    linear-gradient(145deg,#fff8d9,#e7c866)!important;

  color:#8b692d;

  border-color:#a77b32;

  box-shadow:
    inset 0 2px 3px #ffffffaa,
    inset 0 -3px 5px #00000018,
    0 3px 0 #80632955,
    0 5px 9px #4d321f30;
}
  
.yard .token {
  position:relative;
  width:100%;
  height:100%;
  left:auto;
  top:auto;
}

.token.finished {
  background:#fff5cf!important;
  color:#8b692d;
  border-color:#a77b32;
}

.stack-1 {
  margin-left:13%;
  margin-top:13%;
}

.stack-2 {
  margin-left:-13%;
  margin-top:13%;
}

.stack-3 {
  margin-left:13%;
  margin-top:-13%;
}
@keyframes selectablePiece {

  0%,100% {
    transform:translateY(-4px) scale(1.08);
    filter:brightness(1.1);
  }

  50% {
    transform:translateY(-8px) scale(1.13);
    filter:brightness(1.22);
  }

}
@keyframes pulse {
  50% {
    box-shadow:
      0 0 0 6px #fff9dc55,
      0 3px 0 #4d321f55;
  }
}
/* ANIMACIÓN DE FICHAS */
.token.moving-piece {
  animation: pieceMove .28s ease-out;
}

@keyframes pieceMove {
  0% {
    transform: scale(.82);
    opacity:.65;
  }

  60% {
    transform: scale(1.14);
    opacity:1;
  }

  100% {
    transform: scale(1);
    opacity:1;
  }
}
/* =========================================
   LLEGADA AL CENTRO — 2 PEQUEÑOS SALTOS
   ========================================= */

.token.arrived {
  animation: arrivalBounce 0.9s ease-out;
  z-index: 30;
}

@keyframes arrivalBounce {

  0% {
    transform: translateY(0) scale(1);
  }

  18% {
    transform: translateY(-9px) scale(1.08);
  }

  34% {
    transform: translateY(0) scale(1);
  }

  52% {
    transform: translateY(-6px) scale(1.05);
  }

  68% {
    transform: translateY(0) scale(1);
  }

  100% {
    transform: translateY(0) scale(1);
  }

}
/* =====================================================
   ANIMACIÓN DE CAPTURA
   ===================================================== */

.token.captured {
  z-index: 50 !important;
}

/* Señal visual de captura */
.capture-mark {
  position: fixed;
  z-index: 10000;
  pointer-events: none;

  width: 42px;
  height: 42px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background: #e53935;
  color: white;

  font-size: 25px;
  font-weight: 900;
  line-height: 1;

  border: 3px solid white;

  box-shadow:
    0 0 0 4px #e5393555,
    0 5px 14px #0006;

  transform: translate(-50%, -50%) scale(.2);
  opacity: 0;

  animation: captureMark 650ms cubic-bezier(.2,.8,.3,1) forwards;
}

/* La ficha capturada tiembla */
.token.captured {
  animation: capturedShake 500ms ease-in-out forwards;
}

@keyframes capturedShake {

  0% {
    transform: scale(1) rotate(0);
  }

  15% {
    transform: scale(1.15) rotate(-8deg);
  }

  30% {
    transform: scale(1.18) rotate(8deg);
  }

  45% {
    transform: scale(1.10) rotate(-5deg);
  }

  60% {
    transform: scale(1) rotate(3deg);
  }

  100% {
    transform: scale(1) rotate(0);
  }
}

@keyframes captureMark {

  0% {
    transform: translate(-50%, -50%) scale(.2) rotate(-15deg);
    opacity: 0;
  }

  20% {
    transform: translate(-50%, -50%) scale(1.25) rotate(5deg);
    opacity: 1;
  }

  35% {
    transform: translate(-50%, -50%) scale(1) rotate(0);
    opacity: 1;
  }

  70% {
    transform: translate(-50%, -70%) scale(1);
    opacity: 1;
  }

  100% {
    transform: translate(-50%, -95%) scale(.75);
    opacity: 0;
  }
}

/* Ficha que viaja lentamente hacia su casa */
.token.capture-flying {
  position: fixed !important;
  z-index: 9999 !important;
  pointer-events: none !important;
  margin: 0 !important;
  transition: none !important;
}

  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  background: rgba(32,43,62,.45);
  animation: celebrationFade .35s ease-out;
}

  border: 3px solid var(--ink);

}

@keyframes celebrationPop {

  65% {

  }
  100% {

let audioContext;

function getAudioContext() {
  if (!audioContext) {
    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  return audioContext;
}

function tone(
  frequency,
  duration = 0.12,
  type = "sine",
  volume = 0.045,
  delay = 0
) {
  const ctx = getAudioContext();
  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = type;
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);

  gain.gain.exponentialRampToValueAtTime(
    volume,
    ctx.currentTime + delay + 0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    ctx.currentTime + delay + duration
  );

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start(ctx.currentTime + delay);
  oscillator.stop(ctx.currentTime + delay + duration + 0.03);
}

function playSound(type) {
  if (!state.sound) return;

    tone(260, 0.08, "square", 0.03, 0.09);

    tone(430, 0.07, "triangle", 0.025);
    return;
  }

  if (type === "land") {
    tone(620, 0.12, "sine", 0.04);
    tone(820, 0.14, "sine", 0.035, 0.1);
    return;
  }

  if (type === "capture") {

  // Golpe inicial

  // Sonido descendente
  tone(120, 0.12, "sawtooth", 0.035, 0.08);

  tone(75, 0.18, "sawtooth", 0.028, 0.18);

  return;
}

  if (type === "six") {
    tone(520, 0.12, "sine", 0.04);
    tone(700, 0.18, "sine", 0.04, 0.12);
    return;
  }

  if (type === "winner") {

    tone(784, 0.25, "sine", 0.05, 0.32);
  }
}

function coord(color, progress) {
  if (progress < 0 || progress > 57) {
    return null;
  }

  // Meta central
  if (progress === 57) {
    return [7,7];
  }

  let cell;

  if (progress <= 51) {
    cell = track[
      (startIndex[color] + progress) % track.length
    ];
  } else {
    cell = lanes[color][progress - 52] || null;
  }

  if (!cell) {
    return null;
  }

  return cell;
}

function trackIndex(color, progress) {
  if (progress >= 0 && progress <= 51) {
    return (
      startIndex[color] + progress
    ) % track.length;
  }

  return null;
}

function die(n,rolling) {

const positions = {

2:[0,8],

3:[0,4,8],

4:[0,2,6,8],

5:[0,2,4,6,8],

6:[0,2,3,5,6,8]

};

return `

<div class="die ${rolling ? "rolling" : n ? "result" : ""}">

${Array.from(
  {length:9},
  (_,i)=>`

<i
class="pip ${
  n && positions[n].includes(i)
  ?"on"
  :""
}">
</i>

`
).join("")}

</div>

`;

}

const laneAt = (r,c) =>

colors.find(color =>

const trackAt = (r,c) =>

const ti=trackAt(r,c);

const lane=laneAt(r,c);

:

data-action="token"

data-color="${color}"

data-token="${token.id}"

${
state.valid.has(
`${color}-${token.id}`
)
?
""
:
"disabled"
}

>

${token.id+1}

</button>

`
).join("");

cells+=`

<div

class="cell

${ti>=0?"track":""}

${lane?`lane-${lane}`:""}

ti>=0 && safe.has(ti)

"safe"
:
""

function showArrivalConfetti() {

  const container =
    document.createElement("div");

  container.className =
    "arrival-confetti";

  document.body.appendChild(container);

  const pieces = 90;

  for (let i = 0; i < pieces; i++) {

    const piece =
      document.createElement("span");

    piece.className =
      "confetti-piece";

    piece.style.left =
      `${Math.random() * 100}vw`;

    piece.style.background =
      [
        "#e53935",
        "#d9a928",
        "#368f60",
        "#426ba8",
        "#f39c12",
        "#9b59b6"
      ][Math.floor(Math.random() * 6)];

    piece.style.setProperty(
      "--confetti-x",
      `${(Math.random() - 0.5) * 300}px`
    );

    piece.style.setProperty(
      "--confetti-r",
      `${Math.random() * 720 - 360}deg`
    );

    piece.style.animationDelay =
      `${Math.random() * 0.6}s`;

    container.appendChild(piece);
  }

  setTimeout(() => {

    if (container.parentNode) {
      container.remove();
    }

  }, 4000);

  state.settingsOpen = true;

}


if (action === "close-settings") {

}
if (action === "settings-sound") {

}
if (action === "settings-animation") {

}
if (action === "settings-theme") {

}
        /* =========================

          state.mode = "solo";
          state.setupStep = 2;

        }


        /* =========================
           CANTIDAD DE BOTS

        if (action === "bot-count") {

}
        /* =========================

  state.humanColor = "red";
  
  state.playerNames = {

  green:"",

};

  render();

}

function start(count) {

  if (state.mode === "solo") {

    const botColors = colors
      .filter(color => color !== state.humanColor)
      .slice(0, state.botCount);

    state.players = [
      state.humanColor,
      ...botColors
    ];
    console.log("JUGADORES:", state.players);
    state.count = state.players.length;

  } else {

    state.count = count;

    state.players = [
      ...playersByCount[count]
    ];

  }

  state.tokens = freshTokens();

  state.active = 0;

  state.lastRoll = null;
  state.roll = null;

  state.rolling = false;
  state.moving = false;

  state.valid = new Set();

  state.winner = null;

  state.message =
    state.mode === "solo"
      ? "Tu turno. Lanza el dado para comenzar."
      : "Lanza el dado para comenzar. Un seis saca una ficha de casa.";

  state.phase = "playing";

  render();

}

function canMove(token,n) {

return token.progress===-1

?

n===6

:

token.progress!==57 &&
token.progress+n<=57;

}

function chooseBotMove(color) {
  const options = [];

  state.tokens[color].forEach(token => {
    if (!canMove(token, state.roll)) return;

    const finalProgress =
      token.progress === -1
      ? 0
      : token.progress + state.roll;

    let score = finalProgress;

    if (token.progress === -1) score += 40;
    if (finalProgress === 57) score += 200;

    const landing = trackIndex(color, finalProgress);

    if (landing !== null && !safe.has(landing)) {
      state.players
        .filter(opponent => opponent !== color)
        .forEach(opponent => {
          state.tokens[opponent].forEach(enemy => {
            if (trackIndex(opponent, enemy.progress) === landing) {
              score += 100;
            }
          });
        });
    }

    options.push({ id: token.id, score });
  });

  if (!options.length) return null;

  options.sort((a, b) => b.score - a.score);
  return options[0].id;
}

function isBotTurn() {
  return (
    state.mode === "solo" &&
    state.players[state.active] !== state.humanColor
  );
}

function queueBotTurn(delay = 800) {
  if (!isBotTurn()) return;

  setTimeout(() => {
    if (
      state.phase === "playing" &&
      isBotTurn() &&
      !state.rolling &&
      !state.moving &&
      state.roll === null
    ) {
      rollDice(true);
    }
  }, delay);
}

function nextTurn() {
  state.active = (state.active + 1) % state.players.length;
  state.roll = null;
  state.valid = new Set();

  state.message = isBotTurn()
    ? `Turno de ${playerLabel(state.players[state.active])}. El bot está pensando…`
    : "Tu turno. Lanza el dado.";

  render();
  queueBotTurn();
}

function rollDice(fromBot = false) {
  if (
    state.rolling ||
    state.moving ||
    state.roll !== null ||
    (isBotTurn() && !fromBot)
  ) {
    return;
  }

  state.rolling = true;

  if (isBotTurn()) {
 state.message = `${playerLabel(state.players[state.active])} está lanzando el dado…`;
  } else {
    state.message = "El dado está rodando…";
  }

  playSound("dice");
  render();

  setTimeout(() => {
    const n = Math.floor(Math.random() * 6) + 1;
    const color = state.players[state.active];

    state.rolling = false;
    state.lastRoll = n;
    state.roll = n;

    state.valid = new Set(
      state.tokens[color]
        .filter(token => canMove(token, n))
        .map(token => `${color}-${token.id}`)
    );
    
    if (state.valid.size === 1) {
       const onlyToken = [...state.valid][0];
       const id = Number(onlyToken.split("-")[1]);

    setTimeout(() => {
      move(color, id);
      }, 300);

     return;
 }

    if (!state.valid.size) {
state.message = `No hay movimientos válidos para ${playerLabel(color)}.`;

      render();

      setTimeout(() => {
        nextTurn();
      }, 900);

      return;
    }

    if (isBotTurn()) {
    state.message = `${names[color]} está eligiendo una ficha…`;
      render();

      setTimeout(() => {
        const tokenId = chooseBotMove(color);
        if (tokenId !== null) move(color, tokenId);
      }, 700);

      return;
    }

    state.message =
      state.valid.size === 1
        ? "Una ficha puede moverse. Tócala para jugar."
        : "Elige una ficha iluminada.";

    render();
  }, 550);
}

function move(color, id) {
  if (
    state.phase !== "playing" ||
    color !== state.players[state.active] ||
    state.roll === null ||
    !state.valid.has(`${color}-${id}`) ||
    state.moving
  ) {
    return;
  }

  const n = state.roll;
  const token = state.tokens[color][id];

const startProgress =
  token.progress === -1
  ? -1
  : token.progress;
  const finalProgress = token.progress === -1 ? 0 : token.progress + n;

  state.moving = true;
  state.valid = new Set();
  state.message = "Moviendo ficha…";
  render();

  let currentProgress = startProgress;

  function animateStep() {

  const nextProgress = currentProgress + 1;

  // Si ya llegamos al destino, terminamos.
  if (nextProgress > finalProgress) {
    finishMove();
    return;
  }

  currentProgress = nextProgress;

  // Movemos la ficha exactamente una casilla.
  state.tokens[color] = state.tokens[color].map(t =>
    t.id === id
      ? { ...t, progress: currentProgress }
      : t
  );

  playSound("move");

  render();

  // Pequeña pausa entre cada casilla.
  if (currentProgress < finalProgress) {
    setTimeout(animateStep, 180);
  } else {
    setTimeout(finishMove, 120);
  }
}

  function finishMove() {
  let capturedTokens = [];

  const updated = {
    ...state.tokens,
    [color]: state.tokens[color].map(t =>
      t.id === id
        ? { ...t, progress: finalProgress }
        : t
    )
  };

  const landing = trackIndex(color, finalProgress);

  if (landing !== null && !safe.has(landing)) {
    state.players
      .filter(c => c !== color)
      .forEach(opponent => {
        updated[opponent] = updated[opponent].map(t => {
          if (trackIndex(opponent, t.progress) === landing) {
            capturedTokens.push({
              color: opponent,
              id: t.id
            });

            return {
              ...t,
              progress: t.progress,
              captured: true
            };
          }

          return t;
        });
      });
  }

  state.tokens = updated;
  state.moving = false;

  /*
    Si hubo captura:
    primero mostramos la ficha siendo capturada,
    esperamos a que termine la animación
    y después la mandamos a casa.
  */
if (capturedTokens.length) {

  playSound("capture");
  render();

  // Primero mostramos claramente la captura
  setTimeout(() => {

    const animations = capturedTokens.map(
      ({ color: capturedColor, id: capturedId }, index) => {

        return new Promise(resolve => {

          const piece = document.querySelector(
            `.token.captured[data-color="${capturedColor}"][data-token="${capturedId}"]`
          );

          const home = document.querySelector(
            `.home.${capturedColor} .yard`
          );

          if (!piece || !home) {
            resolve();
            return;
          }

          const pieceRect = piece.getBoundingClientRect();
          const homeRect = home.getBoundingClientRect();

          const startX =
            pieceRect.left + pieceRect.width / 2;

          const startY =
            pieceRect.top + pieceRect.height / 2;

          const endX =
            homeRect.left + homeRect.width / 2;

          const endY =
            homeRect.top + homeRect.height / 2;

          /* =========================================
             CREAR LA X / CALAVERA
             ========================================= */

          const mark = document.createElement("div");

          mark.className = "capture-mark";

          /*
             Puedes cambiar ☠ por ✕ si quieres
             una X roja en lugar de calavera.
          */
          mark.textContent = "✕";

          mark.style.left = `${startX}px`;
          mark.style.top = `${startY}px`;

          document.body.appendChild(mark);

          /* =========================================
             OCULTAR LA FICHA ORIGINAL
             ========================================= */

          piece.style.visibility = "hidden";

          /* =========================================
             CREAR FICHA QUE VIAJA A CASA
             ========================================= */

          const flyingPiece = piece.cloneNode(true);

          flyingPiece.classList.remove("captured");
          flyingPiece.classList.remove("valid");
          flyingPiece.classList.add("capture-flying");

          flyingPiece.style.position = "fixed";
          flyingPiece.style.left = `${startX}px`;
          flyingPiece.style.top = `${startY}px`;
          flyingPiece.style.width = `${pieceRect.width}px`;
          flyingPiece.style.height = `${pieceRect.height}px`;
          flyingPiece.style.margin = "0";
          flyingPiece.style.zIndex = "9999";
          flyingPiece.style.pointerEvents = "none";

          flyingPiece.style.transform =
            "translate(-50%, -50%) scale(1)";

          document.body.appendChild(flyingPiece);

          /* =========================================
             PEQUEÑO INSTANTE DESPUÉS DE LA CAPTURA
             ========================================= */

          setTimeout(() => {

            /*
              La señal desaparece antes
              de comenzar el viaje.
            */
            mark.remove();

            const animation = flyingPiece.animate(
              [
                {
                  left: `${startX}px`,
                  top: `${startY}px`,
                  transform:
                    "translate(-50%, -50%) scale(1)",
                  opacity: 1
                },

                {
                  left: `${endX}px`,
                  top: `${endY}px`,
                  transform:
                    "translate(-50%, -50%) scale(.55)",
                  opacity: .7
                }
              ],
              {
                duration: 1400,
                easing: "cubic-bezier(.35,.05,.7,1)",
                fill: "forwards"
              }
            );

            animation.finished.then(() => {

              flyingPiece.remove();

              /*
                La ficha finalmente vuelve a casa.
              */
              state.tokens[capturedColor] =
                state.tokens[capturedColor].map(t =>
                  t.id === capturedId
                    ? {
                        ...t,
                        progress: -1,
                        captured: false
                      }
                    : t
                );

              resolve();

            });

          }, 700 + index * 100);

        });

      }
    );

    Promise.all(animations).then(() => {
      continueAfterMove(finalProgress);
    });

  }, 500);

} else {

  continueAfterMove(finalProgress);

}

  async function continueAfterMove(finalProgress) {
    
    if (finalProgress === 57) {

  state.arrived = {
    color: color,
    id: id
  };

  render();

  requestAnimationFrame(() => {

    const piece = document.querySelector(
      `.token[data-color="${color}"][data-token="${id}"]`
    );

    if (piece) {

      piece.classList.remove("arrived");

      void piece.offsetWidth;

      piece.classList.add("arrived");

    }

  });

  // Confeti al llegar al centro
  showArrivalConfetti();

  // Esperamos a que terminen los dos saltitos
  await new Promise(resolve =>
    setTimeout(resolve, 900)
  );

  state.arrived = null;
}
    if (state.tokens[color].every(token => token.progress === 57)) {
  playSound("winner");

  state.winner = color;
  state.celebrating = true;
  state.roll = null;

  render();

  await new Promise(resolve => setTimeout(resolve, 2200));

  state.celebrating = false;
  state.phase = "winner";

  render();
  return;
}

    if (!capturedTokens.length) {
      playSound("land");
    }

        if (
      n === 6 ||
      capturedTokens.length ||
      finalProgress === 57
    ) {

      state.roll = null;

      if (n === 6 && !capturedTokens.length) {
        playSound("six");
      }

      state.message =
        capturedTokens.length
          ? "¡Captura! Tienes otro turno."
          : finalProgress === 57
          ? "🏁 ¡Ficha en la meta! Tienes otro turno."
          : "¡Un seis! Tienes otro turno.";

      render();
      queueBotTurn();

    } else {

      state.active =
        (state.active + 1) % state.players.length;

      state.roll = null;

      state.message = isBotTurn()
        ? `Turno de ${names[state.players[state.active]]}. El bot está pensando…`
        : "Tu turno. Lanza el dado.";

      render();
      queueBotTurn();
    }
  }
}

  animateStep();
}

render();

})();

</script>
