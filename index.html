<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f1e6" />
<title>Ludo Greyx</title>

<style>
:root {
  --paper:#f7f1e6;
  --ink:#202b3e;
  --muted:#748091;
  --navy:#49668f;
  --coral:#e53935;
  --green:#368f60;
  --yellow:#d9a928;
  --blue:#426ba8;
  --safe:#b6914e;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-width:320px;
  background:
    radial-gradient(
      circle at 82% 0%,
      #fff7d7 0,
      transparent 30%
    ),
    var(--paper);
  color:var(--ink);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button {
  font:inherit;
}

.app {
  min-height:100vh;
}

.shell {
  width:min(1320px,calc(100% - 32px));
  margin:auto;
  padding:18px 0 44px;
}

.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:56px;
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo {
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  border-radius:13px;
  background:#050505;
  color:#fff;
  overflow:hidden;
}

.brand-logo svg {
  width:31px;
  height:31px;
}

.brand-name {
  display:block;
  font-size:1.12rem;
  font-weight:850;
  letter-spacing:-.05em;
  line-height:1;
}

.brand-caption {
  display:block;
  margin-top:5px;
  color:var(--muted);
  font:600 .67rem/1 monospace;
  letter-spacing:.11em;
  text-transform:uppercase;
}

.setup {
  display:grid;
  grid-template-columns:1fr minmax(360px,530px);
  align-items:center;
  gap:clamp(46px,8vw,130px);
  min-height:650px;
}

.eyebrow {
  display:flex;
  align-items:center;
  gap:9px;
  color:#976d32;
  font:700 .7rem/1 monospace;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.eyebrow::before {
  content:"";
  width:24px;
  height:2px;
  background:#e4ac42;
}

h1,
h2,
h3,
p {
  margin-top:0;
}

.setup-title {
  margin:20px 0 23px;
  max-width:650px;
  font-size:clamp(4.2rem,8vw,7.4rem);
  line-height:.82;
  letter-spacing:-.1em;
}

.setup-title em {
  color:var(--coral);
  font-style:normal;
}

.setup-lead {
  max-width:500px;
  color:#687384;
  font-size:clamp(1rem,1.35vw,1.2rem);
  line-height:1.55;
}

.setup-note {
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:36px;
  color:#67717c;
  font-size:.82rem;
}

.setup-card,
.panel {
  border:1px solid #e5dfd3;
  background:#fffdf9ed;
  box-shadow:0 22px 50px #6c58301c;
  border-radius:26px;
}

.setup-card {
  position:relative;
  overflow:hidden;
  padding:38px;
}

.setup-card::after {
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  right:-57px;
  top:-83px;
  border-radius:50%;
  background:#fff2c7;
}

.setup-card>* {
  position:relative;
  z-index:1;
}

.setup-card h2 {
  margin-bottom:8px;
  font-size:1.7rem;
  letter-spacing:-.05em;
}

.setup-card p {
  color:var(--muted);
  font-size:.9rem;
}

.player-options {
  display:grid;
  gap:10px;
  margin:27px 0 20px;
}

.player-option {
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:15px 17px;
  border:1px solid #e5dfd3;
  border-radius:16px;
  background:#fbf7ed;
  color:var(--ink);
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.player-option:hover {
  transform:translateY(-2px);
  border-color:#cda83c;
}

.player-option.selected {
  border:2px solid #d5aa3d;
  padding:14px 16px;
  box-shadow:0 7px 18px #b1872020;
}

.player-option strong,
.player-option small {
  display:block;
}

.player-option strong {
  font-size:.98rem;
}

.player-option small {
  margin-top:4px;
  color:var(--muted);
  font-size:.72rem;
}

.dots {
  display:flex;
  gap:5px;
}

.dot,
.score-dot {
  display:inline-block;
  border-radius:50%;
}

.dot {
  width:12px;
  height:12px;
  border:1px solid #fff;
  box-shadow:0 1px 2px #0003;
}

.red {
  background:var(--coral);
}

.green {
  background:var(--green);
}

.yellow {
  background:var(--yellow);
}

.blue {
  background:var(--blue);
}

.primary-button,
.roll-button {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  width:100%;
  min-height:52px;
  border:0;
  border-radius:15px;
  background:var(--navy);
  color:#fff;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 4px 0 #304868;
  transition:.15s;
}

.primary-button:hover,
.roll-button:hover {
  filter:brightness(1.08);
  transform:translateY(-1px);
}

.mini-board {
  position:fixed;
  bottom:26px;
  left:25%;
  display:grid;
  grid-template-columns:repeat(3,29px);
  gap:5px;
  padding:14px;
  border-radius:22px;
  background:#e5c87c;
  transform:rotate(3deg);
  opacity:.78;
}

.mini-board i {
  display:block;
  width:29px;
  height:29px;
  border-radius:10px;
  background:#f7edca;
}

.mini-board i:nth-child(1) {
  background:#f5bdca;
}

.mini-board i:nth-child(2) {
  background:#b6e3df;
}

.mini-board i:nth-child(3) {
  background:#c8d7ed;
}

.mini-board i:nth-child(4) {
  background:#c9d7ee;
}

.mini-board i:nth-child(5) {
  background:#fff3cf;
}

.mini-board i:nth-child(6) {
  background:#efd8a0;
}

.mini-board i:nth-child(7) {
  background:#f7edca;
}

.mini-board i:nth-child(8) {
  background:#d6ae44;
}

.mini-board i:nth-child(9) {
  background:#f7edca;
}

.game-intro {
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:18px;
}

.game-intro h1 {
  margin:0;
  font-size:clamp(2rem,4vw,3.1rem);
  letter-spacing:-.08em;
}

.game-intro p {
  margin:8px 0 0;
  color:var(--muted);
  font-size:.9rem;
}

.turn-chip {
  display:flex;
  align-items:center;
  gap:9px;

  padding:11px 16px;

  border:1px solid #e1d9cb;
  border-radius:999px;

  color:var(--ink);
  background:#fffaf0;

  font:800 .72rem monospace;

  white-space:nowrap;

  box-shadow:0 4px 12px #6c583018;

  transition:
    background .25s ease,
    border-color .25s ease,
    transform .25s ease;
}
.turn-chip::before {
  content:"";
  width:10px;
  height:10px;

  border-radius:50%;

  background:var(--coral);

  box-shadow:
  0 0 0 4px #e5393520;

  animation:turnPulse 1.5s ease-in-out infinite;
}

.turn-chip.red-turn::before {
  background:var(--coral);
  box-shadow:0 0 0 4px #e5393520;
}

.turn-chip.green-turn::before {
  background:var(--green);
  box-shadow:0 0 0 4px #368f6020;
}

.turn-chip.yellow-turn::before {
  background:var(--yellow);
  box-shadow:0 0 0 4px #d9a92820;
}

.turn-chip.blue-turn::before {
  background:var(--blue);
  box-shadow:0 0 0 4px #426ba820;
}

@keyframes turnPulse {
  50% {
    transform:scale(1.18);
    box-shadow:
      0 0 0 7px ##e5393512;
  }
}
.game-layout {
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:clamp(18px,3vw,42px);
  align-items:start;
}

.board-wrap {
  min-width:0;
}

.board-frame {
  padding:9px;
  border:1px solid #c4a35e;
  border-radius:25px;
  background:#d8b86f;
  box-shadow:0 21px 35px #7d5d2028;
}

.board {
  display:grid;
  position:relative;
  overflow:hidden;
  aspect-ratio:1;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  border-radius:18px;
  background:#f8edcf;
}

.cell {
  position:relative;
  display:grid;
  place-items:center;
  border:1px solid #e8dcc1;
}

.cell.track {
  background:#fff9e7;
}

.cell.lane-red {
  background:#e98b7e;
}

.cell.lane-green {
  background:#80c398;
}

.cell.lane-yellow {
  background:#eed17b;
}

.cell.lane-blue {
  background:#8ca9d6;
}

.cell.start-red {
  background:#f2b1a7;
}

.cell.start-green {
  background:#a9d9b8;
}

.cell.start-yellow {
  background:#f4e3a8;
}

.cell.start-blue {
  background:#bbcbeb;
}

.cell.safe::before {
  content:"★";
  color:#b6914e;
  font-size:clamp(10px,1.4vw,17px);
}
.finish {
  position:absolute;
  z-index:2;

  width:20%;
  height:20%;
  left:40%;
  top:40%;

  display:grid;
  place-items:center;
  overflow:hidden;

  border:1px solid #b89950;
  border-radius:6px;

  background:conic-gradient(
    from 45deg,
    var(--coral) 0 25%,
    var(--yellow) 25% 50%,
    var(--blue) 50% 75%,
    var(--green) 75%
  );

  transform:none;
}

.finish::after {
  content:"";
  width:38%;
  height:38%;
  border-radius:50%;
  background:#fff8da;
  box-shadow:0 0 0 2px #c19e4e;
}

/* =====================================================
   CASAS
   ORDEN FINAL:
   ROJO   = ARRIBA IZQUIERDA
   AZUL   = ARRIBA DERECHA
   VERDE  = ABAJO IZQUIERDA
   AMARILLO = ABAJO DERECHA
   ===================================================== */

.home {
  position:absolute;
  z-index:3;
  display:grid;
  place-items:center;
  padding:7%;
  border-radius:10%;
}

/* Arriba izquierda */
.home.red {
  inset:0 60% 60% 0;
  background:#df6d62;
}

/* Arriba derecha */
.home.blue {
  inset:0 0 60% 60%;
  background:#7191c5;
}

/* Abajo izquierda */
.home.green {
  inset:60% 60% 0 0;
  background:#63aa7d;
}

/* Abajo derecha */
.home.yellow {
  inset:60% 0 0 60%;
  background:#eac34f;
}

.yard {
  display:grid;
  grid-template:repeat(2,1fr)/repeat(2,1fr);
  gap:11%;
  width:100%;
  height:100%;
  padding:13%;
  border-radius:12%;
  background:#fff8decc;
  box-shadow:inset 0 0 0 1px #76551e22;
}

.token {
  position:absolute;
  z-index:6;
  display:grid;
  place-items:center;

  width:76%;
  height:76%;
  left:12%;
  top:12%;

  border:2px solid #ffffffdd;
  border-radius:50%;

  color:#fff;
  font:800 clamp(7px,1vw,12px) monospace;

  cursor:default;

  background:
    radial-gradient(
      circle at 32% 27%,
      #ffffffaa 0 9%,
      transparent 10%
    ),
    radial-gradient(
      circle at 50% 55%,
      #ffffff22 0 35%,
      transparent 36%
    ),
    currentColor;

  box-shadow:
    inset 0 2px 3px #ffffff80,
    inset 0 -4px 5px #00000030,
    0 3px 0 #4d321f55,
    0 5px 9px #4d321f40;

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
}

.token.red {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#f58b80,#c94338);
}

.token.green {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#63b986,#27784e);
}

.token.yellow {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#f4d66a,#c39319);
}

.token.blue {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#7198d2,#31588f);
}

.yard .token {
  position:relative;
  width:100%;
  height:100%;
  left:auto;
  top:auto;
}

.token.valid {
  cursor:pointer;
  outline:3px solid #fffbe4;
  outline-offset:4px;

  animation:selectablePiece 1s ease-in-out infinite;

  filter:brightness(1.12);

  transform:translateY(-4px) scale(1.08);

  box-shadow:
    0 0 0 6px #fff9dc88,
    inset 0 2px 3px #ffffff80,
    inset 0 -4px 5px #00000030,
    0 7px 0 #4d321f55,
    0 11px 15px #4d321f45;
}

.token.valid:hover {
  transform:translateY(-7px) scale(1.16);
  filter:brightness(1.2);
}

.token.valid:active {
  transform:translateY(0) scale(.92);
}

  box-shadow:
    0 0 0 5px #fff9dc66,
    inset 0 2px 3px #ffffff80,
    inset 0 -4px 5px #00000030,
    0 6px 0 #4d321f55,
    0 9px 13px #4d321f40;
}

.token.valid:hover {
  transform:translateY(-5px) scale(1.13);
  filter:brightness(1.18);
}

.token.valid:active {
  transform:translateY(0) scale(.94);
  transition:transform .08s ease;
}
@keyframes selectablePiece {
  0%,100% {
    transform:translateY(-3px) scale(1.05);
  }

  50% {
    transform:translateY(-6px) scale(1.1);
  }
}
.token:disabled {
  opacity:1;
}

.token.finished {
  background:
    radial-gradient(circle at 32% 27%,#ffffffaa 0 9%,transparent 10%),
    linear-gradient(145deg,#fff8d9,#e7c866)!important;

  color:#8b692d;

  border-color:#a77b32;

  box-shadow:
    inset 0 2px 3px #ffffffaa,
    inset 0 -3px 5px #00000018,
    0 3px 0 #80632955,
    0 5px 9px #4d321f30;
}
  
.yard .token {
  position:relative;
  width:100%;
  height:100%;
  left:auto;
  top:auto;
}

.token.finished {
  background:#fff5cf!important;
  color:#8b692d;
  border-color:#a77b32;
}

.stack-1 {
  margin-left:13%;
  margin-top:13%;
}

.stack-2 {
  margin-left:-13%;
  margin-top:13%;
}

.stack-3 {
  margin-left:13%;
  margin-top:-13%;
}
@keyframes selectablePiece {

  0%,100% {
    transform:translateY(-4px) scale(1.08);
    filter:brightness(1.1);
  }

  50% {
    transform:translateY(-8px) scale(1.13);
    filter:brightness(1.22);
  }

}
@keyframes pulse {
  50% {
    box-shadow:
      0 0 0 6px #fff9dc55,
      0 3px 0 #4d321f55;
  }
}
/* ANIMACIÓN DE FICHAS */
.token.moving-piece {
  animation: pieceMove .28s ease-out;
}

@keyframes pieceMove {
  0% {
    transform: scale(.82);
    opacity:.65;
  }

  60% {
    transform: scale(1.14);
    opacity:1;
  }

  100% {
    transform: scale(1);
    opacity:1;
  }
}

/* =====================================================
   ANIMACIÓN DE CAPTURA
   ===================================================== */

.token.captured {
  z-index: 50 !important;
}

/* Señal visual de captura */
.capture-mark {
  position: fixed;
  z-index: 10000;
  pointer-events: none;

  width: 42px;
  height: 42px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background: #e53935;
  color: white;

  font-size: 25px;
  font-weight: 900;
  line-height: 1;

  border: 3px solid white;

  box-shadow:
    0 0 0 4px #e5393555,
    0 5px 14px #0006;

  transform: translate(-50%, -50%) scale(.2);
  opacity: 0;

  animation: captureMark 650ms cubic-bezier(.2,.8,.3,1) forwards;
}

/* La ficha capturada tiembla */
.token.captured {
  animation: capturedShake 500ms ease-in-out forwards;
}

@keyframes capturedShake {

  0% {
    transform: scale(1) rotate(0);
  }

  15% {
    transform: scale(1.15) rotate(-8deg);
  }

  30% {
    transform: scale(1.18) rotate(8deg);
  }

  45% {
    transform: scale(1.10) rotate(-5deg);
  }

  60% {
    transform: scale(1) rotate(3deg);
  }

  100% {
    transform: scale(1) rotate(0);
  }
}

@keyframes captureMark {

  0% {
    transform: translate(-50%, -50%) scale(.2) rotate(-15deg);
    opacity: 0;
  }

  20% {
    transform: translate(-50%, -50%) scale(1.25) rotate(5deg);
    opacity: 1;
  }

  35% {
    transform: translate(-50%, -50%) scale(1) rotate(0);
    opacity: 1;
  }

  70% {
    transform: translate(-50%, -70%) scale(1);
    opacity: 1;
  }

  100% {
    transform: translate(-50%, -95%) scale(.75);
    opacity: 0;
  }
}

/* Ficha que viaja lentamente hacia su casa */
.token.capture-flying {
  position: fixed !important;
  z-index: 9999 !important;
  pointer-events: none !important;
  margin: 0 !important;
  transition: none !important;
}

.legend {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px 18px;
  padding-top:14px;
  color:var(--muted);
  font-size:.7rem;
}

.legend span {
  display:flex;
  align-items:center;
  gap:5px;
}

.legend b {
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--safe);
}

.sidebar {
  display:grid;
  gap:14px;
}

.panel {
  padding:18px;
}

.status-label {
  color:#9b7438;
  font:700 .65rem monospace;
  letter-spacing:.11em;
  text-transform:uppercase;
}

.status-player {
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 0 17px;
}

.orb {
  width:15px;
  height:15px;
  border-radius:50%;
}

.status-player strong,
.status-player small {
  display:block;
}

.status-player strong {
  font-size:1.05rem;
}

.status-player small {
  margin-top:3px;
  color:var(--muted);
  font-size:.72rem;
}

.dice-row {
  display:grid;
  grid-template-columns:62px 1fr;
  gap:12px;
  align-items:center;
}

.die {
  display:grid;
  grid-template:repeat(3,1fr)/repeat(3,1fr);
  gap:4px;
  width:62px;
  height:62px;
  padding:9px;
  border:1px solid #dac49a;
  border-radius:15px;
  background:#fff5cf;
}

.pip {
  width:100%;
  height:100%;
  border-radius:50%;
  background:#455f89;
  opacity:0;
}

.pip.on {
  opacity:1;
}

.rolling {
  animation:
    diceRoll .18s ease-in-out infinite,
    diceShake .55s ease-in-out infinite;
  transform-origin:center;
}

@keyframes diceRoll {
  0% {
    transform:rotate(0deg) scale(1);
  }

  25% {
    transform:rotate(18deg) scale(1.06);
  }

  50% {
    transform:rotate(-18deg) scale(1.1);
  }

  75% {
    transform:rotate(12deg) scale(1.06);
  }

  100% {
    transform:rotate(0deg) scale(1);
  }
}

@keyframes diceShake {
  0%,100% {
    filter:brightness(1);
  }

  50% {
    filter:brightness(1.12);
  }
}

.die.result {
  animation:diceResult .3s ease-out;
}

@keyframes diceResult {
  0% {
    transform:scale(.82) rotate(-8deg);
    opacity:.65;
  }

  55% {
    transform:scale(1.12) rotate(4deg);
    opacity:1;
  }

  100% {
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

.hint {
  min-height:34px;
  margin:15px 0 0;
  color:var(--muted);
  font-size:.78rem;
  line-height:1.4;
}

.hint.pass {
  color:#a36938;
}

.panel h3 {
  margin:0 0 15px;
  font-size:.93rem;
}

.score-grid {
  display:grid;
  grid-template-columns:1fr 38px 48px 38px;
  align-items:center;
  gap:7px;
}

.score-head {
  color:#a08763;
  font:700 .57rem monospace;
  text-align:center;
}

.score-name {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:.77rem;
}

.score-dot {
  width:8px;
  height:8px;
}

.score-value {
  color:#5b6674;
  font:700 .77rem monospace;
  text-align:center;
}

.rules {

let audioContext;

function getAudioContext() {
  if (!audioContext) {
    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  return audioContext;
}

function tone(
  frequency,
  duration = 0.12,
  type = "sine",
  volume = 0.045,
  delay = 0
) {
  const ctx = getAudioContext();
  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = type;
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);

  gain.gain.exponentialRampToValueAtTime(
    volume,
    ctx.currentTime + delay + 0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    ctx.currentTime + delay + duration
  );

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start(ctx.currentTime + delay);
  oscillator.stop(ctx.currentTime + delay + duration + 0.03);
}

      </section>


      <div class="mini-board">
</div>

    </main>

    `;

  }

}

function bind() {

  app.querySelectorAll(
    "[data-action]"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const action =
          button.dataset.action;


        // ─────────────────────
        // JUGADORES LOCALES
        // ─────────────────────

        if(action === "count") {

          state.count =
            Number(button.dataset.count);

          state.mode = "local";

          state.setupStep = 1;

          render();

        }


        // ─────────────────────
        // CONTRA BOT
        // ─────────────────────

        if(action === "mode") {

          state.mode = "solo";

          state.setupStep = 2;

          render();

        }


        // ─────────────────────
        // CANTIDAD DE BOTS
        // ─────────────────────

        if(action === "bot-count") {

          state.botCount =
            Number(button.dataset.bots);

          render();

        }


        // ─────────────────────
        // CONTINUAR A ELECCIÓN
        // DE COLOR
        // ─────────────────────

        if(action === "bot-continue") {

          state.setupStep = 3;

          render();

        }


        // ─────────────────────
        // COLOR DEL JUGADOR
        // ─────────────────────

        if(action === "human-color") {

          state.humanColor =
            button.dataset.color;

          render();

        }


        // ─────────────────────
        // VOLVER EN EL LOBBY
        // ─────────────────────

        if(action === "back-setup") {

          state.setupStep =
            Math.max(
              1,
              state.setupStep - 1
            );

          render();

        }


        // ─────────────────────
        // SONIDO
        // ─────────────────────

        if(action === "sound") {

          state.sound =
            !state.sound;

          render();

        }


        // ─────────────────────
        // EMPEZAR PARTIDA
        // ─────────────────────

        if(action === "start") {

          start(state.count);

        }


        // ─────────────────────
        // VOLVER AL SETUP
        // ─────────────────────

        if(action === "setup") {

          setup();

        }


        // ─────────────────────
        // JUGAR OTRA VEZ
        // ─────────────────────

        if(action === "again") {

          start(state.players.length);

        }


        // ─────────────────────
        // LANZAR DADO
        // ─────────────────────

        if(action === "roll") {

          rollDice();

        }


        // ─────────────────────
        // MOVER FICHA
        // ─────────────────────

        if(action === "token") {

          move(
            button.dataset.color,
            Number(button.dataset.token)
          );

        }

      }
    );

  });

}

function setup() {

state.phase="setup";
state.winner=null;
state.valid=new Set();
state.roll=null;

render();

}

function start(count) {

  state.players =
    playersByCount[count];

  state.humanColor = "red";

  state.tokens = freshTokens();

  state.active = 0;

  state.lastRoll = null;
  state.roll = null;

  state.rolling = false;
  state.moving = false;

  state.valid = new Set();

  state.winner = null;

  state.message =
    state.mode === "solo"
    ? "Tu turno. Lanza el dado para comenzar."
    : "Lanza el dado para comenzar. Un seis saca una ficha de casa.";

  state.phase = "playing";

  render();
}

function canMove(token,n) {

return token.progress===-1

?

n===6

:

token.progress!==57 &&
token.progress+n<=57;

}

function chooseBotMove(color) {
  const options = [];

  state.tokens[color].forEach(token => {
    if (!canMove(token, state.roll)) return;

    const finalProgress =
      token.progress === -1
      ? 0
      : token.progress + state.roll;

    let score = finalProgress;

    if (token.progress === -1) score += 40;
    if (finalProgress === 57) score += 200;

    const landing = trackIndex(color, finalProgress);

    if (landing !== null && !safe.has(landing)) {
      state.players
        .filter(opponent => opponent !== color)
        .forEach(opponent => {
          state.tokens[opponent].forEach(enemy => {
            if (trackIndex(opponent, enemy.progress) === landing) {
              score += 100;
            }
          });
        });
    }

    options.push({ id: token.id, score });
  });

  if (!options.length) return null;

  options.sort((a, b) => b.score - a.score);
  return options[0].id;
}

function isBotTurn() {
  return (
    state.mode === "solo" &&
    state.players[state.active] !== state.humanColor
  );
}

function queueBotTurn(delay = 800) {
  if (!isBotTurn()) return;

  setTimeout(() => {
    if (
      state.phase === "playing" &&
      isBotTurn() &&
      !state.rolling &&
      !state.moving &&
      state.roll === null
    ) {
      rollDice(true);
    }
  }, delay);
}

function nextTurn() {
  state.active = (state.active + 1) % state.players.length;
  state.roll = null;
  state.valid = new Set();

  state.message = isBotTurn()
    ? `Turno de ${names[state.players[state.active]]}. El bot está pensando…`
    : "Tu turno. Lanza el dado.";

  render();
  queueBotTurn();
}

function rollDice(fromBot = false) {
  if (
    state.rolling ||
    state.moving ||
    state.roll !== null ||
    (isBotTurn() && !fromBot)
  ) {
    return;
  }

  state.rolling = true;

  if (isBotTurn()) {
    state.message = `${names[state.players[state.active]]} está lanzando el dado…`;
  } else {
    state.message = "El dado está rodando…";
  }

  playSound("dice");
  render();

  setTimeout(() => {
    const n = Math.floor(Math.random() * 6) + 1;
    const color = state.players[state.active];

    state.rolling = false;
    state.lastRoll = n;
    state.roll = n;

    state.valid = new Set(
      state.tokens[color]
        .filter(token => canMove(token, n))
        .map(token => `${color}-${token.id}`)
    );
    
    if (state.valid.size === 1) {
       const onlyToken = [...state.valid][0];
       const id = Number(onlyToken.split("-")[1]);

    setTimeout(() => {
      move(color, id);
      }, 300);

     return;
 }

    if (!state.valid.size) {
      state.message = `No hay movimientos válidos para ${names[color]}.`;

      render();

      setTimeout(() => {
        nextTurn();
      }, 900);

      return;
    }

    if (isBotTurn()) {
      state.message = `${names[color]} está eligiendo una ficha…`;
      render();

      setTimeout(() => {
        const tokenId = chooseBotMove(color);
        if (tokenId !== null) move(color, tokenId);
      }, 700);

      return;
    }

    state.message =
      state.valid.size === 1
        ? "Una ficha puede moverse. Tócala para jugar."
        : "Elige una ficha iluminada.";

    render();
  }, 550);
}

function move(color, id) {
  if (
    state.phase !== "playing" ||
    color !== state.players[state.active] ||
    state.roll === null ||
    !state.valid.has(`${color}-${id}`) ||
    state.moving
  ) {
    return;
  }

  const n = state.roll;
  const token = state.tokens[color][id];

const startProgress =
  token.progress === -1
  ? -1
  : token.progress;
  const finalProgress = token.progress === -1 ? 0 : token.progress + n;

  state.moving = true;
  state.valid = new Set();
  state.message = "Moviendo ficha…";
  render();

  let currentProgress = startProgress;

  function animateStep() {

  const nextProgress = currentProgress + 1;

  // Si ya llegamos al destino, terminamos.
  if (nextProgress > finalProgress) {
    finishMove();
    return;
  }

  currentProgress = nextProgress;

  // Movemos la ficha exactamente una casilla.
  state.tokens[color] = state.tokens[color].map(t =>
    t.id === id
      ? { ...t, progress: currentProgress }
      : t
  );

  playSound("move");

  render();

  // Pequeña pausa entre cada casilla.
  if (currentProgress < finalProgress) {
    setTimeout(animateStep, 180);
  } else {
    setTimeout(finishMove, 120);
  }
}

  function finishMove() {
  let capturedTokens = [];

  const updated = {
    ...state.tokens,
    [color]: state.tokens[color].map(t =>
      t.id === id
        ? { ...t, progress: finalProgress }
        : t
    )
  };

  const landing = trackIndex(color, finalProgress);

  if (landing !== null && !safe.has(landing)) {
    state.players
      .filter(c => c !== color)
      .forEach(opponent => {
        updated[opponent] = updated[opponent].map(t => {
          if (trackIndex(opponent, t.progress) === landing) {
            capturedTokens.push({
              color: opponent,
              id: t.id
            });

            return {
              ...t,
              progress: t.progress,
              captured: true
            };
          }

          return t;
        });
      });
  }

  state.tokens = updated;
  state.moving = false;

  /*
    Si hubo captura:
    primero mostramos la ficha siendo capturada,
    esperamos a que termine la animación
    y después la mandamos a casa.
  */
if (capturedTokens.length) {

  playSound("capture");
  render();

  // Primero mostramos claramente la captura
  setTimeout(() => {

    const animations = capturedTokens.map(
      ({ color: capturedColor, id: capturedId }, index) => {

        return new Promise(resolve => {

          const piece = document.querySelector(
            `.token.captured[data-color="${capturedColor}"][data-token="${capturedId}"]`
          );

          const home = document.querySelector(
            `.home.${capturedColor} .yard`
          );

          if (!piece || !home) {
            resolve();
            return;
          }

          const pieceRect = piece.getBoundingClientRect();
          const homeRect = home.getBoundingClientRect();

          const startX =
            pieceRect.left + pieceRect.width / 2;

          const startY =
            pieceRect.top + pieceRect.height / 2;

          const endX =
            homeRect.left + homeRect.width / 2;

          const endY =
            homeRect.top + homeRect.height / 2;


          /* =========================================
             CREAR LA X / CALAVERA
             ========================================= */

          const mark = document.createElement("div");

          mark.className = "capture-mark";

          /*
             Puedes cambiar ☠ por ✕ si quieres
             una X roja en lugar de calavera.
          */
          mark.textContent = "✕";

          mark.style.left = `${startX}px`;
          mark.style.top = `${startY}px`;

          document.body.appendChild(mark);


          /* =========================================
             OCULTAR LA FICHA ORIGINAL
             ========================================= */

          piece.style.visibility = "hidden";


          /* =========================================
             CREAR FICHA QUE VIAJA A CASA
             ========================================= */

          const flyingPiece = piece.cloneNode(true);

          flyingPiece.classList.remove("captured");
          flyingPiece.classList.remove("valid");
          flyingPiece.classList.add("capture-flying");

          flyingPiece.style.position = "fixed";
          flyingPiece.style.left = `${startX}px`;
          flyingPiece.style.top = `${startY}px`;
          flyingPiece.style.width = `${pieceRect.width}px`;
          flyingPiece.style.height = `${pieceRect.height}px`;
          flyingPiece.style.margin = "0";
          flyingPiece.style.zIndex = "9999";
          flyingPiece.style.pointerEvents = "none";

          flyingPiece.style.transform =
            "translate(-50%, -50%) scale(1)";

          document.body.appendChild(flyingPiece);


          /* =========================================
             PEQUEÑO INSTANTE DESPUÉS DE LA CAPTURA
             ========================================= */

          setTimeout(() => {

            /*
              La señal desaparece antes
              de comenzar el viaje.
            */
            mark.remove();


            const animation = flyingPiece.animate(
              [
                {
                  left: `${startX}px`,
                  top: `${startY}px`,
                  transform:
                    "translate(-50%, -50%) scale(1)",
                  opacity: 1
                },

                {
                  left: `${endX}px`,
                  top: `${endY}px`,
                  transform:
                    "translate(-50%, -50%) scale(.55)",
                  opacity: .7
                }
              ],
              {
                duration: 1400,
                easing: "cubic-bezier(.35,.05,.7,1)",
                fill: "forwards"
              }
            );


            animation.finished.then(() => {

              flyingPiece.remove();

              /*
                La ficha finalmente vuelve a casa.
              */
              state.tokens[capturedColor] =
                state.tokens[capturedColor].map(t =>
                  t.id === capturedId
                    ? {
                        ...t,
                        progress: -1,
                        captured: false
                      }
                    : t
                );

              resolve();

            });

          }, 700 + index * 100);

        });

      }
    );


    Promise.all(animations).then(() => {
      continueAfterMove(finalProgress);
    });

  }, 500);

} else {

  continueAfterMove(finalProgress);

}

  async function continueAfterMove(finalProgress) {
    
    if (finalProgress === 57) {
  state.arrived = {
    color: color,
    id: id
  };

  render();

  // Forzar la animación de llegada
  requestAnimationFrame(() => {
    const piece = document.querySelector(
  `.token[data-color="${color}"][data-token="${id}"]`
    );

    if (piece) {
      piece.classList.remove("arrived");
      void piece.offsetWidth;
      piece.classList.add("arrived");
    }
  });

  await new Promise(resolve => setTimeout(resolve, 900));

  state.arrived = null;
}
    if (state.tokens[color].every(token => token.progress === 57)) {
  playSound("winner");

  state.winner = color;
  state.celebrating = true;
  state.roll = null;

  render();

  await new Promise(resolve => setTimeout(resolve, 2200));

  state.celebrating = false;
  state.phase = "winner";

  render();
  return;
}

    if (!capturedTokens.length) {
      playSound("land");
    }

        if (
      n === 6 ||
      capturedTokens.length ||
      finalProgress === 57
    ) {

      state.roll = null;

      if (n === 6 && !capturedTokens.length) {
        playSound("six");
      }

      state.message =
        capturedTokens.length
          ? "¡Captura! Tienes otro turno."
          : finalProgress === 57
          ? "🏁 ¡Ficha en la meta! Tienes otro turno."
          : "¡Un seis! Tienes otro turno.";

      render();
      queueBotTurn();

    } else {

      state.active =
        (state.active + 1) % state.players.length;

      state.roll = null;

      state.message = isBotTurn()
        ? `Turno de ${names[state.players[state.active]]}. El bot está pensando…`
        : "Tu turno. Lanza el dado.";

      render();
      queueBotTurn();
    }
  }
}

  animateStep();
}

render();

})();

</script>
