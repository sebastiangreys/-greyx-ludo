      fb.getDoc(fb.doc(fb.db, "usernames", lower)).catch(() => null),
      fs.getDocs(fs.query(
        fs.collection(fb.db, "publicProfiles"),
        fs.where("usernameLower", ">=", lower),
        fs.where("usernameLower", "<=", lower + "\uf8ff"),
        fs.limit(8)
      )).catch(e => { console.warn("prefix", e); return null; })
    ]);

    if (seq !== friendsSearchSeq) return; // llegó una búsqueda más nueva

    const map = new Map();
    if (exact && exact.exists()) {
      const d = exact.data();
      map.set(d.uid, { uid: d.uid, username: d.username || q, avatar: d.avatar || "a1" });
    }
    if (prefix) {
      prefix.docs.forEach(doc => {
        if (map.has(doc.id)) return;
        const d = doc.data();
        map.set(doc.id, { uid: doc.id, username: d.username, avatar: d.avatar || "a1" });
      });
    }
    map.delete(state.user.uid); // quítate a ti mismo

    state.friendsResults = [...map.values()];
    state.friendsSearchNote = state.friendsResults.length ? "" : "No se encontró ese jugador.";
  } catch (e) {
    if (seq !== friendsSearchSeq) return;
    console.warn("searchFriends", e);
    state.friendsResults = [];
    state.friendsSearchNote = "No se pudo buscar (" + (e.code || "error") + ")";
  }

  state.friendsSearchBusy = false;
  render();
}

function friendRequestId(fromUid, toUid) {
  return fromUid + "_" + toUid;
}

async function sendFriendRequest(toUid, toUsername) {
  if (!fb || !fb.db || !state.user || !state.profile) return;
  if (toUid === state.user.uid) {
    state.friendsSearchNote = "No puedes enviarte una solicitud a ti mismo.";
    render();
    return;
  }

  const fromUid = state.user.uid;
  const id = friendRequestId(fromUid, toUid);
  const reverseId = friendRequestId(toUid, fromUid);

  state.friendsReqBusy = true;
  state.friendsSearchNote = "";
  render();

  try {
    const existing = await fb.getDoc(fb.doc(fb.db, "friendRequests", id));
    if (existing.exists()) {
      const st = existing.data().status;
      state.friendsSearchNote = st === "pending"
        ? "Ya enviaste una solicitud a este jugador."
        : st === "accepted"
          ? "Ya son amigos."
          : "Solicitud anterior rechazada. (Podrás reenviar más adelante.)";
      state.friendsReqBusy = false;
      render();
      return;
    }

    const reverse = await fb.getDoc(fb.doc(fb.db, "friendRequests", reverseId));
    if (reverse.exists() && reverse.data().status === "pending") {
      state.friendsSearchNote = "Este jugador ya te envió una solicitud. Revísala abajo.";
      state.friendsReqBusy = false;
      await loadFriendRequests();
      return;
    }
    if (reverse.exists() && reverse.data().status === "accepted") {
      state.friendsSearchNote = "Ya son amigos.";
      state.friendsReqBusy = false;
      render();
      return;
    }

    await fb.setDoc(fb.doc(fb.db, "friendRequests", id), {
      from: fromUid,
      to: toUid,
      fromUsername: state.profile.username,
      fromAvatar: state.profile.avatar || "a1",
      toUsername: toUsername || "",
      status: "pending",
      createdAt: fb.serverTimestamp()
    });

    state.friendsSearchNote = "Solicitud enviada.";
    state.friendsResults = [];
    await loadFriendRequests();
  } catch (e) {
    console.warn("sendFriendRequest", e);
    state.friendsSearchNote = "No se pudo enviar. Revisa reglas de Firebase.";
  }

  state.friendsReqBusy = false;
  render();
}



async function loadFriendRequests() {
  if (!fb || !fb.db || !state.user) return;

  try {
    const fs = await fsModule();
    const uid = state.user.uid;

    const incomingQ = fs.query(
      fs.collection(fb.db, "friendRequests"),
      fs.where("to", "==", uid),
      fs.where("status", "==", "pending")
    );
    const outgoingQ = fs.query(
      fs.collection(fb.db, "friendRequests"),
      fs.where("from", "==", uid),
      fs.where("status", "==", "pending")
    );

    const [inSnap, outSnap] = await Promise.all([
      fs.getDocs(incomingQ),
      fs.getDocs(outgoingQ)
    ]);

    state.friendsIncoming = inSnap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    state.friendsOutgoing = outSnap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  } catch (e) {
    console.warn("loadFriendRequests", e);
    state.friendsIncoming = [];
    state.friendsOutgoing = [];
  }

  if (state.showFriends) render();
}
async function loadFriendsList() {
  if (!fb || !fb.db || !state.user) {
    state.friendsList = [];
    return;
  }

  try {
    const fs = await fsModule();
    const snap = await fs.getDocs(
      fs.collection(fb.db, "users", state.user.uid, "friends")
    );

    state.friendsList = snap.docs.map(d => {
      const data = d.data() || {};
      return {
        uid: d.id,
        username: data.username || "jugador",
        avatar: data.avatar || "a1",
        starred: !!data.starred,
        nickname: data.nickname || null,
        online: !!data.online
      };
    });
  } catch (e) {
    console.warn("loadFriendsList", e);
    state.friendsList = [];
  }

  if (state.showFriends) render();
}
async function openPlayer(uid) {
  if (!fb || !fb.db || !uid) return;
  const known = [...(state.friendsResults || []), ...(state.friendsList || []),
                 ...(state.friendsIncoming || [])].find(x => x.uid === uid) || {};
  state.viewPlayer = {
    uid, username: known.username || known.fromUsername || "jugador",
    avatar: known.avatar || known.fromAvatar || "a1", loading: true
  };

  render();

  try {
    state.isAdmin = (await fb.getDoc(fb.doc(fb.db, "admins", state.user.uid))).exists();

  } catch (e) {

function copyPlayerId(uid) {
  const done = () => {
    state.copied = true; render();
    setTimeout(() => { state.copied = false; render(); }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(uid).then(done).catch(done);
  } else {
    const t = document.createElement("textarea");
    t.value = uid; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (e) {}
    t.remove(); done();
  }
}

async function acceptFriendRequest(reqId) {
  if (!fb || !fb.db || !state.user) return;
  state.friendsReqBusy = true;
  render();

  try {
    const ref = fb.doc(fb.db, "friendRequests", reqId);
    const snap = await fb.getDoc(ref);
    if (!snap.exists()) throw new Error("missing");
    const data = snap.data();
    if (data.to !== state.user.uid || data.status !== "pending") throw new Error("forbidden");

    await fb.updateDoc(ref, { status: "accepted" });

    // Amistad en ambos lados (Etapa 4 base)
    const batch = fb.writeBatch(fb.db);
    const a = data.from;
    const b = data.to;
    batch.set(fb.doc(fb.db, "users", b, "friends", a), {
      uid: a,
      username: data.fromUsername || "",
      avatar: data.fromAvatar || "a1",
      starred: false,
      nickname: null,
      since: fb.serverTimestamp()
    });
    batch.set(fb.doc(fb.db, "users", a, "friends", b), {
      uid: b,
      username: state.profile ? state.profile.username : "",
      avatar: state.profile ? state.profile.avatar : "a1",
      starred: false,
      nickname: null,
      since: fb.serverTimestamp()
    });
    await batch.commit();

    await loadFriendRequests();
    await loadFriendsList();
    state.friendsSearchNote = "Solicitud aceptada.";
  } catch (e) {
    console.warn("acceptFriendRequest", e);
    state.friendsSearchNote = "No se pudo aceptar.";
  }

  state.friendsReqBusy = false;
  render();
}

async function rejectFriendRequest(reqId) {
  if (!fb || !fb.db || !state.user) return;
  state.friendsReqBusy = true;
  render();

  try {
    const ref = fb.doc(fb.db, "friendRequests", reqId);
    const snap = await fb.getDoc(ref);
    if (!snap.exists()) throw new Error("missing");
    const data = snap.data();
    if (data.to !== state.user.uid || data.status !== "pending") throw new Error("forbidden");

    await fb.updateDoc(ref, { status: "rejected" });
    await loadFriendRequests();

    console.warn("rejectFriendRequest", e);

  render();
}

async function saveProfile() {
  if (state.profileBusy || !fb || !fb.db || !state.user) return;

  if (state.showProfile === "edit") { saveAvatar(); return; }

  const name = state.profileName.trim();
  const bad = validateUsername(name);
  if (bad) {
    state.profileError = PROFILE_MSG[bad];
    render();
    return;
  }

  const lower = name.toLowerCase();
  const uid = state.user.uid;

  state.profileBusy = true;
  state.profileError = "";
  state.profileNotice = "";
  render();

  try {
    const taken = await fb.getDoc(fb.doc(fb.db, "usernames", lower));
    if (taken.exists()) {
      state.profileBusy = false;
      state.profileError = PROFILE_MSG.taken;
      render();
      return;
    }

    const batch = fb.writeBatch(fb.db);
    batch.set(fb.doc(fb.db, "usernames", lower), {
  uid: uid, username: name, avatar: state.profileAvatar
});

    batch.set(fb.doc(fb.db, "users", uid), {
      username: name,
      usernameLower: lower,
      avatar: state.profileAvatar,
      createdAt: fb.serverTimestamp(),
      updatedAt: fb.serverTimestamp()
    });
    await batch.commit();

    state.profile = { username: name, usernameLower: lower, avatar: state.profileAvatar };
   syncPublic();
     state.profileBusy = false;
    state.showProfile = null;
    render();

  } catch (e) {
    state.profileBusy = false;
    state.profileError = profileErrText(e, true);
    render();
  }
}

 syncPublic();

function handleProfileAction(action) {

  if (action.startsWith("profile-avatar-")) {
    const id = action.slice("profile-avatar-".length);
    if (AVATARS[id]) state.profileAvatar = id;
    state.profileNotice = "";
    render();
    return true;
  }

  if (action === "profile-open") {
    state.settingsOpen = false;
    state.confirmAction = null;
    state.showProfile = "edit";
    state.profileAvatar = state.profile ? state.profile.avatar : "a1";
    state.profileError = "";
    state.profileNotice = "";
    render();
    return true;
  }

  if (action === "profile-create") {
    state.settingsOpen = false;
    state.confirmAction = null;
    state.showProfile = "create";
    state.profileName = "";
    state.profileAvatar = "a1";
    state.profileError = "";
    state.profileNotice = "";
    render();
    return true;
  }

  if (action === "profile-save") {
    saveProfile();
    return true;
  }

  if (action === "profile-skip") {
    state.profileSkipped = true;
    state.showProfile = null;
    render();
    return true;
  }

  if (action === "profile-close") {
    state.showProfile = null;
    render();
    return true;
  }

  return false;
}

async function grantXPByPlace(place) {
  if (!state.user || !fb || !fb.db) return;
  if (state.mode !== "solo") return;

  const amount = XP_BY_PLACE[place] || 0;
  if (amount <= 0) {
    state.xpResult = { granted: 0, leveledUp: false, newLevel: state.xpLevel || 1, place };
    return;
  }

  // Reutiliza la lógica de grantXP pero con "amount" fijo:
  // Copia grantXP y cambia:
  //   const base = dailyEarned >= XP_DAILY_CAP ? XP_REDUCED : amount;
  // en lugar de won ? XP_WIN : XP_LOSE

  const uid = state.user.uid;
  let granted = 0;
  let leveledUp = false;
  let newLevel = 0;

  try {
    const fs = await fsModule();
    const ref = fs.doc(fb.db, "stats", uid);

    await fs.runTransaction(fb.db, async tx => {
      const snap = await tx.get(ref);
      const d = snap.exists() ? snap.data() : {};
      const today = todayRD();
      const dailyDate = d.xpDailyDate || "";
      const dailyEarned = dailyDate === today ? (d.xpDailyEarned || 0) : 0;

      const base = dailyEarned >= XP_DAILY_CAP ? XP_REDUCED : amount;
      granted = base;

      const prevXP = d.xp || 0;
      const newXP = prevXP + granted;
      const prevLv = xpLevelFromTotal(prevXP);
      const newLv = xpLevelFromTotal(newXP);
      if (newLv > prevLv) { leveledUp = true; newLevel = newLv; }

      const update = {
        xp: newXP,
        xpDailyDate: today,
        xpDailyEarned: dailyDate === today
          ? dailyEarned + (base === XP_REDUCED ? 0 : base)
          : (base === XP_REDUCED ? 0 : base),
        updatedAt: fs.serverTimestamp()
      };

      if (snap.exists()) tx.update(ref, update);
      else tx.set(ref, Object.assign({
        played: 0, wins: 0, losses: 0, captures: 0, goals: 0,
        trophies: 0, streak: 0, bestStreak: 0
      }, update));

      state.xp = newXP;
      state.xpLevel = newLv;
    });

    state.xpResult = { granted, leveledUp, newLevel, place };
    showXPPopup(granted);
    if (leveledUp) setTimeout(() => showLevelUp(newLevel), 1200);
  } catch (e) {
    console.warn("grantXPByPlace", e);
  }
}
async function submitGameResult(place) {
  if (state.statsRecorded) return;
  state.statsRecorded = true;
  if (!state.user || !state.profile || !fb || !fb.db) return;
  const g = state.gameStats || { captures: 0, goals: 0 };
  try {
    const fs = await fsModule();
    const prevLevel = xpLevelFromTotal(state.xp || 0);
    const r = await GreyxCore.submitGame({
      fb, fs, uid: state.user.uid, profile: state.profile,
      place, bots: Math.max(1, state.players.length - 1),
      captures: g.captures, goals: g.goals,
      durationMs: Date.now() - (state.gameStartedAt || Date.now())
    });
    if (!r) return;
    state.stats = r.stats;
    state.statsUid = state.user.uid;
    state.xp = r.stats.xp;
    state.xpLevel = xpLevelFromTotal(r.stats.xp);
    state.xpLoaded = true;
    state.gameResult = { delta: r.trophyDelta };
    const up = state.xpLevel > prevLevel;
    state.xpResult = { granted: r.xpGranted, leveledUp: up, newLevel: state.xpLevel, place };
    if (r.xpGranted > 0) showXPPopup(r.xpGranted);
    if (up) setTimeout(() => showLevelUp(state.xpLevel), 1200);
  } catch (e) {
    console.warn("submitGameResult", e);
  }
}

async function endGameWithRanking() {
  state.ranking = state.finishedOrder.slice();
  state.winner = state.ranking[0] || null;

  const humanIdx = state.ranking.indexOf(state.humanColor);
  const humanPlace = humanIdx >= 0 ? humanIdx + 1 : 0;

  if (state.mode === "solo" && humanPlace > 0) {
    await submitGameResult(humanPlace);
  }

  state.celebrating = true;
  state.roll = null;
  render();
  await new Promise(r => setTimeout(r, 2200));
  state.celebrating = false;
  state.phase = "winner";
  render();
}

async function recordGameResult() {
  if (state.mode !== "solo" || state.statsRecorded) return;
  state.statsRecorded = true;
  if (!state.user || !fb || !fb.db) return;

  const uid = state.user.uid;
const place = (state.ranking || state.finishedOrder || []).indexOf(state.humanColor);
const won = place === 0; // 1º lugar
  const bots = Math.max(1, state.players.length - 1);
  const gain = 4 + 4 * bots;
  const g = state.gameStats || { captures:0, goals:0 };

  let saved = null;
  let before = 0;

  try {
    const fs = await fsModule();
    const ref = fs.doc(fb.db, "stats", uid);

    await fs.runTransaction(fb.db, async tx => {
      const snap = await tx.get(ref);
      const o = snap.exists() ? snap.data() : STATS_EMPTY;
      const streak = won ? (o.streak || 0) + 1 : 0;

      before = o.trophies || 0;

      const n = {
        played: o.played + 1,
        wins: o.wins + (won ? 1 : 0),
        losses: o.losses + (won ? 0 : 1),
        captures: o.captures + Math.min(g.captures, 40),
        goals: o.goals + Math.min(g.goals, 4),
        trophies: won ? before + gain : (before > 3 ? before - 3 : 0),
        streak: streak,
        bestStreak: Math.max(o.bestStreak || 0, streak),
        updatedAt: fs.serverTimestamp()
      };

      tx.set(ref, n);
      saved = n;
    });

    if (saved && state.user && state.user.uid === uid) {
      const copy = Object.assign({}, saved);
      delete copy.updatedAt;
      state.stats = copy;
      state.statsUid = uid;
      state.gameResult = { delta: saved.trophies - before };
      if (state.phase === "winner") render();
    }
  } catch (e) {
    console.warn("No se pudo guardar el resultado:", e);
  }
}

    render();

    return true;

  if (action === "room-invite") {
    state.showFriends = true;
    state.showOnline = false;
    render();
    return true;
  }

  if (action === "room-start") {
    if (state.roomPlayers.length >= 2) {

function startMatchmaking() {
  if (state.mmActive) return;
  state.mmActive = true;
  state.mmSeconds = 0;
  state.mmFound = 1;
  render();

  mmInterval = setInterval(() => {
    state.mmSeconds++;

    // Simula ir encontrando jugadores reales
    if (state.mmSeconds === 6 && state.onlinePlayerCount >= 3) state.mmFound = 2;
    if (state.mmSeconds === 14 && state.onlinePlayerCount >= 4) state.mmFound = 3;

    // Si encontramos todos los jugadores reales, arranca
    if (state.mmFound >= state.onlinePlayerCount) {
      stopMatchmaking();
      enterOnlineGame();
      return;
    }

    // Al llegar a 30s completa con bots y arranca
    if (state.mmSeconds >= 30) {
      state.mmFound = state.onlinePlayerCount;
      stopMatchmaking();
      setTimeout(() => enterOnlineGame(), 500);
      return;
    }

    render();
  }, 1000);
}

];

const XP_MAX_LEVEL = 100;
const XP_DAILY_CAP = 300;
const XP_WIN  = 60;
const XP_LOSE = 20;
const XP_BY_PLACE = { 1: 60, 2: 40, 3: 20 }; // 4º o peor = 0
const XP_REDUCED = 5;
const XP_TZ = "America/Santo_Domingo";

function xpLevelFromTotal(total) {
  let lv = 1;
  for (let i = 1; i < XP_TABLE.length; i++) {
    if (total >= XP_TABLE[i]) lv = i + 1;
    else break;
  }
  return Math.min(lv, XP_MAX_LEVEL);
}

function xpForLevel(lv) {
  return XP_TABLE[Math.min(lv - 1, XP_TABLE.length - 1)];
}

function xpToNext(total) {
  const lv = xpLevelFromTotal(total);
  if (lv >= XP_MAX_LEVEL) return 0;
  return xpForLevel(lv + 1) - total;
}

function xpBarPct(total) {
  const lv = xpLevelFromTotal(total);
  if (lv >= XP_MAX_LEVEL) return 100;
  const base = xpForLevel(lv);
  const next = xpForLevel(lv + 1);
  return Math.round((total - base) / (next - base) * 100);
}

function todayRD() {
  return new Date().toLocaleDateString("en-CA", { timeZone: XP_TZ });

    await fs.runTransaction(fb.db, async tx => {
      const snap = await tx.get(ref);
      const d = snap.exists() ? snap.data() : {};

      const today = todayRD();
      const dailyDate  = d.xpDailyDate  || "";
      const dailyEarned = dailyDate === today ? (d.xpDailyEarned || 0) : 0;

      const base = dailyEarned >= XP_DAILY_CAP
        ? XP_REDUCED
        : won ? XP_WIN : XP_LOSE;

      granted = base;

      const prevXP = d.xp || 0;
      const newXP  = prevXP + granted;
      const prevLv = xpLevelFromTotal(prevXP);
      const newLv  = xpLevelFromTotal(newXP);

      if (newLv > prevLv) { leveledUp = true; newLevel = newLv; }

      const update = {
        xp: newXP,
        xpDailyDate:   today,
        xpDailyEarned: dailyDate === today ? dailyEarned + (base === XP_REDUCED ? 0 : base) : (base === XP_REDUCED ? 0 : base),
        updatedAt: fs.serverTimestamp()
      };

      if (snap.exists()) tx.update(ref, update);
      else tx.set(ref, { ...update, played:0, wins:0, losses:0, captures:0, goals:0,
        trophies:0, streak:0, bestStreak:0 });

      state.xp = newXP;
      state.xpLevel = newLv;
    });

    state.xpResult = { granted, leveledUp, newLevel };
    if (state.phase === "winner") render();

    showXPPopup(granted);
    if (leveledUp) setTimeout(() => showLevelUp(newLevel), 1200);

  } catch (e) {
    console.warn("grantXP", e);
  }
}

function showXPPopup(amount) {
  const pop = document.createElement("div");
  pop.className = "xp-popup";
  pop.style.cssText = "left:50%;top:55%;transform:translateX(-50%)";
  pop.innerHTML = `
    <div class="xp-popup-badge">+${amount} XP</div>
    <div class="xp-popup-label">EXPERIENCIA</div>
  `;
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 3000);
}

function showLevelUp(lv) {
  const ov = document.createElement("div");
  ov.className = "levelup-overlay";
  ov.innerHTML = `
    <div class="levelup-card">
      <div class="levelup-star">⭐</div>
      <div class="levelup-title">¡SUBISTE DE NIVEL!</div>
      <div class="levelup-num">${lv}</div>
      <div class="levelup-sub">${lv >= XP_MAX_LEVEL ? "¡Has llegado al nivel máximo!" : "Sigue jugando para subir más."}</div>
    </div>
  `;
  document.body.appendChild(ov);
  setTimeout(() => ov.remove(), 3300);
}

function xpBarMarkup() {
  if (!state.xpLoaded || !state.user) return "";
  const lv  = state.xpLevel;
  const pct = xpBarPct(state.xp);
  const toNext = xpToNext(state.xp);
  return `
    <div class="xp-bar-wrap">
      <div class="xp-bar-fill" style="width:${pct}%"></div>
    </div>
    <div class="xp-next-label">
      <span>NV. ${lv}</span>
      <span>${lv >= XP_MAX_LEVEL ? "MÁXIMO" : toNext + " XP para NV. " + (lv+1)}</span>
    </div>
  `;
}
window.GX = {
  get fb() { return fb; },
  get state() { return state; },
  fsModule, render,
  xpLevelFromTotal, xpForLevel, xpToNext, xpBarPct,
  avatarEmoji
};

showTapGate();
startAuth();

})();
</script>

.gx6-card{position:relative;min-height:176px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 8px 34px;border-radius:22px;color:#fff;border:2px solid var(--cc);background:var(--cb);box-shadow:0 0 22px var(--cg),inset 0 1px 0 #ffffff22}
.gx6-card svg{width:48px;height:48px;margin-bottom:8px;color:var(--ci)}
.gx6-card strong{font:900 .8rem/1.15 Inter,system-ui,sans-serif}
.gx6-card small{margin-top:6px;color:#aab3d6;font-size:.62rem;line-height:1.35}
.gx6-card u{position:absolute;right:9px;bottom:9px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:#ffffff18;border:1px solid #ffffff33;text-decoration:none;font-size:1rem}
.gx6-prog{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;padding:14px;border-radius:22px;border:2px solid #4a45d8aa;background:linear-gradient(160deg,#10164a,#080b2a);box-shadow:0 0 22px #3b3fd844}
.gx6-hex{position:relative;flex:0 0 auto;width:78px;height:86px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(145deg,#a78bfa,#4338ca)}
.gx6-hex::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:linear-gradient(160deg,#1b1f6b,#0a0c30)}
.gx6-hex div{position:relative;text-align:center;line-height:1}
.gx6-hex small{display:block;font:800 .55rem Inter,system-ui,sans-serif;color:#a9b0ff;letter-spacing:.1em}
.gx6-hex b{font-size:1.9rem;font-weight:900}
.gx6-pb{flex:1;min-width:0;border-left:1px solid #ffffff1c;padding-left:14px}
.gx6-pt{font:900 .72rem Inter,system-ui,sans-serif;letter-spacing:.12em;margin-bottom:8px}
.gx6-ps{display:flex;gap:10px}
.gx6-ps div{flex:1;display:flex;align-items:center;gap:7px;font-size:1.05rem}
.gx6-ps div+div{border-left:1px solid #ffffff1c;padding-left:10px}
.gx6-ps b{display:block;font-size:1.15rem;line-height:1}
.gx6-ps small{font-size:.56rem;letter-spacing:.06em;color:#94a0cc}
.gx6-bar2{display:flex;align-items:center;gap:10px;margin-top:10px}
.gx6-bar2 span{flex:1;height:10px;border-radius:9px;border:1.5px solid #6d5cff;background:#0a0d30;overflow:hidden}
.gx6-bar2 span i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa)}
.gx6-bar2 em{font-style:normal;font-size:.72rem;color:#c2c8ee;white-space:nowrap}
.gx6-nav{position:fixed;left:0;right:0;bottom:0;z-index:86;display:none;padding:10px 6px max(10px,env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;border:1.5px solid #2e3a9a88;border-bottom:0;background:linear-gradient(180deg,#0c1240f5,#070a24)}
.gx6-nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;color:#aeb6e6;font:700 .74rem Inter,system-ui,sans-serif}
.gx6-nav button+button::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:#ffffff18}
.gx6-nav svg{width:26px;height:26px}
.gx6-nav button.on{color:#8b7cff}
.gx6-nav button.on::after{content:"";width:46px;height:3px;border-radius:3px;background:#6d5cff;box-shadow:0 0 8px #6d5cff}
.gx6-toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;padding:11px 20px;border-radius:99px;background:#111631;border:1px solid #a78bfa;font-weight:800;font-size:.82rem;box-shadow:0 10px 30px #000c}

/* ===== limpieza ===== */
.gx-gems,.gx-shop{display:none!important}
.gx-home{display:none!important}
html,body{overscroll-behavior:none}
.gx6-in{padding-top:34px}
.gx6-nav.on{display:flex;animation:gx6Up .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes gx6Up{from{transform:translateY(100%)}to{transform:none}}
/* ===== entrada: la X sin defectos ===== */
.gx-name{transform:none!important;will-change:auto!important;letter-spacing:.3em;margin-right:-.3em;font-size:clamp(1.5rem,7vw,3.3rem)}
.gx-letter{will-change:auto!important;backface-visibility:visible!important;-webkit-backface-visibility:visible!important;animation-name:gx6Letter!important;animation-duration:.55s!important;animation-fill-mode:both!important}
.gx-letter.gx-x{color:#7c3aed;text-shadow:none!important;filter:drop-shadow(0 0 10px #7c3aedcc) drop-shadow(0 0 24px #7c3aed88);animation-name:gx6LetterX!important}
@keyframes gx6Letter{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes gx6LetterX{0%{opacity:0;transform:translateX(-18px) scale(1.25)}70%{opacity:1;transform:translateX(0) scale(1.06)}100%{opacity:1;transform:none}}

/* ===== tablero: las 4 casas siempre visibles ===== */
body .board{background:${BOARD_URI} center/100% 100% no-repeat,#e9edfb}
body .board .cell:not(.track):not([class*="lane-"]){background:transparent;border-color:transparent}
.board:not(:has(.home.red)) :is(.cell.lane-red,.cell.start-red),
.board:not(:has(.home.green)) :is(.cell.lane-green,.cell.start-green),
.board:not(:has(.home.yellow)) :is(.cell.lane-yellow,.cell.start-yellow),
.board:not(:has(.home.blue)) :is(.cell.lane-blue,.cell.start-blue){opacity:.3}
main:has(.turn-chip.red-turn) .home.red,main:has(.turn-chip.green-turn) .home.green,
main:has(.turn-chip.yellow-turn) .home.yellow,main:has(.turn-chip.blue-turn) .home.blue{animation:gx7Glow 1.4s ease-in-out infinite}
@keyframes gx7Glow{0%,100%{box-shadow:inset 0 0 0 0 #fff0}50%{box-shadow:inset 0 0 0 5px #ffffffaa}}

/* ===== sin logo arriba en ninguna pantalla ===== */
.topbar{display:none!important}
.shell:has(.top-actions){padding-top:calc(66px + env(safe-area-inset-top,0px))}

/* ===== juego en celular: dado siempre a mano ===== */
@media (max-width:560px){
  .game-intro h1{display:none}
  .game-intro{padding:10px 14px;margin-bottom:12px;text-align:center}
  .turn-chip{margin-top:0;display:inline-flex}
  main:has(.dice-row){padding-bottom:190px}
  .dice-row{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:60;background:linear-gradient(145deg,#1b2040,#10142a);box-shadow:0 14px 34px #000c,0 0 0 1px #8b5cf655}
  .hint{position:fixed;left:16px;right:16px;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 100px);z-index:60;margin:0;min-height:0;padding:7px 12px;border-radius:14px;background:#0b0e24dd;color:#e2e8f0;font-size:.74rem;font-weight:700;text-align:center}
  .hint:empty{display:none}
}

/* ===== configuración: fija a la pantalla ===== */
body.gx7-lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
body .settings-overlay{top:0;left:0;right:0;bottom:auto;height:100%;height:100dvh;overscroll-behavior:contain}
body .settings-panel{overscroll-behavior:contain}

<script>
(() => {
  const fab = document.createElement("button");
  fab.className = "gx-fab";
  fab.type = "button";
  fab.setAttribute("aria-label", "Configuración");
  fab.innerHTML = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>`;
  document.body.appendChild(fab);

  fab.addEventListener("click", () => {
    const o = document.querySelector('.top-actions [data-action="settings"]');
    if (o) o.click();
  });

  const sync = () => {
    const ok = !!document.querySelector('.top-actions [data-action="settings"]');
    const blocked = !!document.querySelector(".settings-overlay,.gx-intro,.gx-gate");
    const onMenu = !!document.querySelector(".gx6.on");
fab.style.display = ok && !blocked && !onMenu ? "grid" : "none";
  };

  new MutationObserver(sync).observe(document.body, { childList: true, subtree: true });
  setInterval(sync, 400);
  sync();
})();
</script>
