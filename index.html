<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f1e6" />
<title>Ludo Greyx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --paper:#f7f1e6;
  --ink:#202b3e;
  --muted:#748091;
  --navy:#49668f;
  --coral:#e53935;
  --green:#368f60;
  --yellow:#d9a928;
  --blue:#426ba8;
  --safe:#b6914e;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
  min-width:320px;
  min-height:100vh;

background-color: #030615;
background-image: url("assets/photo-output.jpeg");
background-position: center center;
background-size: cover;
background-repeat: no-repeat;
background-attachment: fixed;

  color:#f7f1e6;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
button {
  font:inherit;
}

.app {
  min-height:100vh;
}
.shell {
  width:min(1180px,calc(100% - 36px));
  min-height:100vh;
  margin:auto;
  padding:24px 0 50px;
  position:relative;
}
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  position:relative;
  z-index:5;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-logo {
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  border-radius:13px;
  background:#050505;
  color:#fff;
  overflow:hidden;
}
.brand-logo svg {
  width:31px;
  height:31px;
}
.brand-name {
  display:block;
  font-size:1.12rem;
  font-weight:850;
  letter-spacing:-.05em;
  line-height:1;
}
.brand-caption {
  display:block;
  margin-top:5px;
  color:var(--muted);
  font:600 .67rem/1 monospace;
  letter-spacing:.11em;
  text-transform:uppercase;
}
.setup {
  display:grid;
  grid-template-columns:1fr minmax(360px,530px);
  align-items:center;
  gap:clamp(46px,8vw,130px);
  min-height:650px;
}
.setup-modern {
  position:relative;
  min-height:680px;
  grid-template-columns:minmax(0,1fr) minmax(390px,500px);
  gap:clamp(50px,8vw,120px);

  padding-top:70px;
}

.setup-modern::before {
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  left:-180px;
  bottom:-180px;
  border-radius:50%;
  background:#7b61ff18;
  filter:blur(10px);
  pointer-events:none;
}

.setup-copy {
  position:relative;
  z-index:2;
  animation:menuCopyIn .65s ease-out both;
}

.setup-modern .eyebrow {
  color:#9f91ff;
}

.setup-modern .eyebrow::before {
  background:#7b61ff;
}

.setup-title {
  color:#fff;
  text-transform:uppercase;
  text-shadow:0 10px 35px #00000040;
}

.setup-title span {
  display:block;
  color:#8c7cff;
  letter-spacing:-.11em;
}

.setup-title-small {
  font-size:clamp(3.2rem,6vw,5.5rem);
}

.setup-lead {
  color:#aeb5c7;
}

.setup-status {
  display:inline-flex;
  align-items:center;
  gap:9px;
  margin-top:34px;
  padding:9px 13px;
  border:1px solid #ffffff12;
  border-radius:999px;
  background:#ffffff08;
  color:#8992a7;
  font:700 .64rem/1 monospace;
  letter-spacing:.1em;
}

.status-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:#62d891;
  box-shadow:0 0 12px #62d891;
}

.setup-card-modern {
  position:relative;
  overflow:hidden;
  border:1px solid #ffffff12;
  background:
    linear-gradient(145deg,#1d2232ee,#121622f2);
  box-shadow:
    0 30px 80px #00000055,
    inset 0 1px 0 #ffffff0b;
  border-radius:30px;
  padding:30px;
  color:#fff;
  animation:menuCardIn .65s .08s ease-out both;
}

.setup-card-modern::before {
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  right:-110px;
  top:-110px;
  border-radius:50%;
  background:#7b61ff20;
  filter:blur(4px);
}

.setup-card-glow {
  position:absolute;
  width:120px;
  height:120px;
  left:-70px;
  bottom:-70px;
  border-radius:50%;
  background:#d64e4318;
  filter:blur(8px);
}

.setup-card-header {
  position:relative;
  z-index:2;
  margin-bottom:22px;
}

.setup-card-kicker {
  display:block;
  margin-bottom:8px;
  color:#8f83ef;
  font:800 .62rem/1 monospace;
  letter-spacing:.16em;
}

.setup-card-modern h2 {
  margin:0;
  color:#fff;
  font-size:1.65rem;
  letter-spacing:-.05em;
}

.setup-card-modern .setup-card-header p {
  margin:7px 0 0;
  color:#8e97aa;
}

.mode-grid {
  position:relative;
  z-index:2;
  display:grid;
  gap:11px;
}

.mode-card {
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  min-height:76px;
  padding:13px;
  border:1px solid #ffffff0e;
  border-radius:18px;
  background:#ffffff06;
  color:#fff;
  text-align:left;
  cursor:pointer;
  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.mode-card:hover {
  transform:translateY(-2px);
  background:#ffffff0c;
  border-color:#8c7cff55;
}

.mode-card.selected {
  border-color:#8c7cff99;
  background:linear-gradient(100deg,#8c7cff18,#ffffff08);
  box-shadow:0 8px 25px #00000022;
}

.mode-icon {
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:14px;
  background:#ffffff0a;
  font-size:22px;
}

.mode-info {
  display:flex;
  flex:1;
  flex-direction:column;
  gap:4px;
}

.mode-info strong {
  font-size:.94rem;
}

.mode-info small {
  color:#858fa4;
  font-size:.69rem;
  line-height:1.35;
}

.mode-arrow {
  color:#737d92;
  font-size:25px;
}

.setup-divider {
  height:1px;
  margin:22px 0 15px;
  background:#ffffff0b;
}

.setup-footer {
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#727c90;
  font-size:.7rem;
}

.sound-mini {
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border:1px solid #ffffff10;
  border-radius:11px;
  background:#ffffff07;
  color:#fff;
  cursor:pointer;
  transition:.2s;
}

.sound-mini:hover {
  background:#ffffff12;
  transform:scale(1.05);
}

.player-count-grid {
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:25px 0;
}

.player-count-card {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:115px;
  border:1px solid #ffffff0d;
  border-radius:18px;
  background:#ffffff06;
  color:#fff;
  cursor:pointer;
  transition:.2s ease;
}

.player-count-card:hover {
  transform:translateY(-3px);
  border-color:#8c7cff55;
}

.player-count-card.selected {
  border-color:#8c7cff99;
  background:#8c7cff18;
  box-shadow:0 8px 25px #00000022;
}

.player-count-card strong {
  font-size:2.2rem;
  line-height:1;
}

.player-count-card span {
  margin-top:9px;
  color:#7e889c;
  font:700 .58rem/1 monospace;
  letter-spacing:.08em;
}

.setup-actions {
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:10px;
  margin-top:24px;
}

.secondary-button {
  min-height:52px;
  padding:0 18px;
  border:1px solid #ffffff14;
  border-radius:15px;
  background:#ffffff07;
  color:#aab1c0;
  font-weight:750;
  cursor:pointer;
  transition:.2s;
}

.secondary-button:hover {
  background:#ffffff0d;
  color:#fff;
}

.setup-card-modern .primary-button {
  min-height:52px;
  background:#7b68e8;
  box-shadow:0 5px 0 #4d429b;
}

.setup-card-modern .primary-button:hover {
  background:#8978f5;
}

.name-list {
  position:relative;
  z-index:2;
  display:grid;
  gap:9px;
}

.name-field {
  display:flex;
  align-items:center;
  gap:11px;
  min-height:58px;
  padding:9px 12px;
  border:1px solid #ffffff0d;
  border-radius:15px;
  background:#ffffff06;
}

.name-color,
.color-preview {
  flex:0 0 auto;
  border-radius:50%;
}

.name-color {
  width:13px;
  height:13px;
}

.name-field-content {
  display:flex;
  flex:1;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.name-field-content > span {
  color:#c5cad5;
  font-size:.78rem;
  font-weight:750;
}

.name-field input {
  width:50%;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  text-align:right;
  font:600 .78rem inherit;
}

.name-field input::placeholder {
  color:#596275;
}

.color-grid {
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-bottom:12px;
}

.color-card {
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border:1px solid #ffffff0d;
  border-radius:15px;
  background:#ffffff06;
  color:#fff;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.color-card:hover {
  transform:translateY(-2px);
  border-color:#ffffff25;
}

.color-card.selected {
  border-color:#8c7cff99;
  background:#8c7cff15;
}

.color-preview {
  width:29px;
  height:29px;
  box-shadow:inset 0 2px 3px #ffffff66,0 3px 8px #00000035;
}

.color-card strong,
.color-card small {
  display:block;
}

.color-card strong {
  font-size:.78rem;
}

.color-card small {
  margin-top:3px;
  color:#737d91;
  font-size:.6rem;
}

.solo-name-field {
  position:relative;
  z-index:2;
  margin-top:10px;
}

@keyframes menuCopyIn {
  from {
    opacity:0;
    transform:translateX(-18px);
  }
  to {
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes menuCardIn {
  from {
    opacity:0;
    transform:translateY(18px) scale(.98);
  }
  to {
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
.eyebrow {
  display:flex;
  align-items:center;
  gap:9px;
  color:#976d32;
  font:700 .7rem/1 monospace;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.eyebrow::before {
  content:"";
  width:24px;
  height:2px;
  background:#e4ac42;
}
h1,
h2,
h3,
p {
  margin-top:0;
}
.setup-title {
  margin:20px 0 23px;
  max-width:650px;
  font-size:clamp(4.2rem,8vw,7.4rem);
  line-height:.82;
  letter-spacing:-.1em;
}
.setup-title em {
  color:var(--coral);
  font-style:normal;
}
.setup-lead {
  max-width:500px;
  color:#687384;
  font-size:clamp(1rem,1.35vw,1.2rem);
  line-height:1.55;
}
.setup-note {
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:36px;
  color:#67717c;
  font-size:.82rem;
}
.setup-card,
.panel {
  border:1px solid #e5dfd3;
  background:#fffdf9ed;
  box-shadow:0 22px 50px #6c58301c;
  border-radius:26px;
}
.setup-card {
  position:relative;
  overflow:hidden;
  padding:38px;
}
.setup-card::after {
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  right:-57px;
  top:-83px;
  border-radius:50%;
  background:#fff2c7;
}
.setup-card>* {
  position:relative;
  z-index:1;
}
.setup-card h2 {
  margin-bottom:8px;
  font-size:1.7rem;
  letter-spacing:-.05em;
}
.setup-card p {
  color:var(--muted);
  font-size:.9rem;
}
.player-options {
  display:grid;
  gap:10px;
  margin:27px 0 20px;
}
.player-option {
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:15px 17px;
  border:1px solid #e5dfd3;
  border-radius:16px;
  background:#fbf7ed;
  color:var(--ink);
  text-align:left;
  cursor:pointer;
  transition:.2s;
}
.player-option:hover {
  transform:translateY(-2px);
  border-color:#cda83c;
}
.player-option.selected {
  border:2px solid #d5aa3d;
  padding:14px 16px;
  box-shadow:0 7px 18px #b1872020;
}
.player-option strong,
.player-option small {
  display:block;
}
.player-option strong {
  font-size:.98rem;
}
.player-option small {
  margin-top:4px;
  color:var(--muted);
  font-size:.72rem;
}
.dots {
  display:flex;
  gap:5px;
}
.dot,
.score-dot {
  display:inline-block;
  border-radius:50%;
}
.dot {
  width:12px;
  height:12px;
  border:1px solid #fff;
  box-shadow:0 1px 2px #0003;
}
.red {
  background:var(--coral);
}
.green {
  background:var(--green);
}
.yellow {
  background:var(--yellow);
}

.blue {
  background:var(--blue);
}
.primary-button,
.roll-button {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  width:100%;
  min-height:54px;
  border:1px solid #ffffff20;
  border-radius:16px;
  background:
    linear-gradient(135deg,#8c7cff,#6355c7);
  color:#ffffff;
  font-weight:900;
  letter-spacing:.01em;
  cursor:pointer;

  box-shadow:
    0 8px 0 #3d357d,
    0 14px 28px #00000040,
    inset 0 1px 0 #ffffff35;

  transition:
    transform .15s ease,
    filter .15s ease,
    box-shadow .15s ease;
}

.primary-button::before,
.roll-button::before {
  content:"";
  position:absolute;
  inset:1px;
  border-radius:15px;
  background:linear-gradient(
    180deg,
    #ffffff18,
    transparent 45%
  );
  pointer-events:none;
}

.primary-button:hover,
.roll-button:hover {
  filter:brightness(1.1);
  transform:translateY(-2px);
  box-shadow:
    0 10px 0 #3d357d,
    0 18px 32px #0000004d,
    0 0 22px #8c7cff35,
    inset 0 1px 0 #ffffff40;
}

.primary-button:active,
.roll-button:active {
  transform:translateY(5px);
  box-shadow:
    0 3px 0 #3d357d,
    0 7px 15px #00000035,
    inset 0 2px 5px #00000025;
}

.primary-button:disabled,
.roll-button:disabled {
  cursor:not-allowed;
  filter:grayscale(.35);
  opacity:.55;
  transform:none;
  box-shadow:
    0 4px 0 #30354a,
    0 8px 16px #00000025;
}
.primary-button:hover,
.roll-button:hover {
  filter:brightness(1.08);
  transform:translateY(-1px);
}
.mini-board {
  position:fixed;
  bottom:26px;
  left:25%;
  display:grid;
  grid-template-columns:repeat(3,29px);
  gap:5px;
  padding:14px;
  border-radius:22px;
  background:#e5c87c;
  transform:rotate(3deg);
  opacity:.78;
}
.mini-board i {
  display:block;
  width:29px;
  height:29px;
  border-radius:10px;
  background:#f7edca;
}
.mini-board i:nth-child(1) {
  background:#f5bdca;
}
.mini-board i:nth-child(2) {
  background:#b6e3df;
}
.mini-board i:nth-child(3) {
  background:#c8d7ed;
}
.mini-board i:nth-child(4) {
  background:#c9d7ee;
}
.mini-board i:nth-child(5) {
  background:#fff3cf;
}
.mini-board i:nth-child(6) {
  background:#efd8a0;
}
.mini-board i:nth-child(7) {
  background:#f7edca;
}
.mini-board i:nth-child(8) {
  background:#d6ae44;
}
.mini-board i:nth-child(9) {
  background:#f7edca;
}
.game-intro {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:24px;
  padding:18px 20px;
  border:1px solid #ffffff12;
  border-radius:20px;
  background:linear-gradient(145deg,#202535e8,#121621e8);
  box-shadow:
    0 18px 40px #00000035,
    inset 0 1px 0 #ffffff0c;
  backdrop-filter:blur(10px);
}

.game-intro h1 {
  margin:0;
  font-size:clamp(1.8rem,3vw,2.6rem);
  line-height:1;
  letter-spacing:-.04em;
  color:#ffffff;
  text-shadow:0 0 20px #8c7cff22;
}

.game-intro p {
  margin:8px 0 0;
  color:#9da5b8;
  font-size:.86rem;
}
.game-intro h1 {
  margin:0;
  font-size:clamp(2rem,4vw,3.1rem);
  letter-spacing:-.08em;
}
.game-intro p {
  margin:8px 0 0;
  color:var(--muted);
  font-size:.9rem;
}
.turn-chip {
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 15px;
  border:1px solid #ffffff18;
  border-radius:999px;
  background:#171b29;
  color:#ffffff;
  font-size:.78rem;
  font-weight:800;
  white-space:nowrap;
  box-shadow:
    0 8px 20px #00000030,
    inset 0 1px 0 #ffffff0a;
}

.turn-chip::before {
  content:"";
  width:9px;
  height:9px;
  border-radius:50%;
  background:#8c7cff;
  box-shadow:
    0 0 8px #8c7cffcc,
    0 0 16px #8c7cff55;
}
.turn-chip.red-turn::before {
  background:var(--coral);
  box-shadow:0 0 0 4px #e5393520;
}
.turn-chip.green-turn::before {
  background:var(--green);
  box-shadow:0 0 0 4px #368f6020;
}
.turn-chip.yellow-turn::before {
  background:var(--yellow);
  box-shadow:0 0 0 4px #d9a92820;
}
.turn-chip.blue-turn::before {
  background:var(--blue);
  box-shadow:0 0 0 4px #426ba820;
}
@keyframes turnPulse {
  50% {
    transform:scale(1.18);
    box-shadow:
      0 0 0 7px #e5393512;
  }
}
.game-layout {
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:clamp(18px,3vw,42px);
  align-items:start;
}

.board-wrap {
  min-width:0;
}

.board-frame {
  position:relative;
  padding:10px;
  border:1px solid #ffffff18;
  border-radius:28px;
  background:
    linear-gradient(145deg,#252a3bee,#111522f5);
  box-shadow:
    0 30px 70px #00000055,
    0 0 0 1px #7b68e822,
    inset 0 1px 0 #ffffff12;
}

.board-frame::before {
  content:"";
  position:absolute;
  inset:-2px;
  z-index:-1;
  border-radius:30px;
  background:
    linear-gradient(
      135deg,
      #8c7cff55,
      transparent 35%,
      #d64e4330 75%,
      transparent
    );
  filter:blur(14px);
  opacity:.7;
}

.board {
  display:grid;
  position:relative;
  overflow:hidden;
  aspect-ratio:1;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  border-radius:20px;
  background:#171b29;
  box-shadow:
    inset 0 0 0 1px #ffffff10,
    inset 0 0 35px #00000035;
}

.cell {
  position:relative;
  display:grid;
  place-items:center;
  border:1px solid #ffffff0b;
  background:#171b29;
}

.cell.track {
  background:
    linear-gradient(145deg,#252a3a,#1d2230);
  box-shadow:
    inset 0 0 0 1px #ffffff05;
}

.cell.lane-red {
  background:linear-gradient(145deg,#a83d46,#682b38);
  box-shadow:inset 0 0 12px #e5393520;
}

.cell.lane-green {
  background:linear-gradient(145deg,#3b8b63,#23523f);
  box-shadow:inset 0 0 12px #368f6020;
}

.cell.lane-yellow {
  background:linear-gradient(145deg,#b58c2d,#735d24);
  box-shadow:inset 0 0 12px #d9a92820;
}

.cell.lane-blue {
  background:linear-gradient(145deg,#4f6fa9,#2e426c);
  box-shadow:inset 0 0 12px #426ba820;
}

.cell.start-red {
  background:linear-gradient(145deg,#d94b50,#8c303c);
  box-shadow:inset 0 0 15px #ff6b6b25;
}

.cell.start-green {
  background:linear-gradient(145deg,#4ca978,#2d684c);
  box-shadow:inset 0 0 15px #63d59620;
}

.cell.start-yellow {
  background:linear-gradient(145deg,#d8ad3c,#8c6d25);
  box-shadow:inset 0 0 15px #ffe27a20;
}

.cell.start-blue {
  background:linear-gradient(145deg,#6085c2,#3a527f);
  box-shadow:inset 0 0 15px #7da7ff20;
}

.cell.safe::before {
  content:"★";
  color:#c7a8ff;
  font-size:clamp(10px,1.4vw,17px);
  text-shadow:
    0 0 6px #8c7cff99,
    0 0 12px #8c7cff55;
}
.finish {
  position:absolute;
  z-index:2;
  width:20%;
  height:20%;
  left:40%;
  top:40%;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:1px solid #ffffff30;
  border-radius:10px;
  background:
    conic-gradient(
      from 45deg,
      #e53935 0 25%,
      #d9a928 25% 50%,
      #426ba8 50% 75%,
      #368f60 75%
    );
  box-shadow:
    0 0 25px #8c7cff25,
    inset 0 0 20px #ffffff18;
}

.finish::after {
  content:"GX";
  display:grid;
  place-items:center;
  width:42%;
  height:42%;
  border-radius:50%;
  background:#151925;
  color:#ffffff;
  font:900 clamp(7px,1.2vw,15px)/1 monospace;
  letter-spacing:-.08em;
  box-shadow:
    0 0 0 2px #ffffff55,
    0 0 18px #8c7cff77,
    inset 0 0 10px #00000055;
}

/* =====================================================
   CASAS
   ORDEN FINAL:
   ROJO   = ARRIBA IZQUIERDA
   AZUL   = ARRIBA DERECHA
   VERDE  = ABAJO IZQUIERDA
   AMARILLO = ABAJO DERECHA
   ===================================================== */

.home {
  position:absolute;
  z-index:3;
  display:grid;
  place-items:center;
  padding:7%;
  border-radius:10%;
}

/* Arriba izquierda */
.home.red {
  inset:0 60% 60% 0;
  background:
    linear-gradient(145deg,#d94b50,#7d2938);
  box-shadow:inset 0 0 25px #ff6b6b22;
}

.home.blue {
  inset:0 0 60% 60%;
  background:
    linear-gradient(145deg,#5477b7,#293f69);
  box-shadow:inset 0 0 25px #7da7ff22;
}

.home.green {
  inset:60% 60% 0 0;
  background:
    linear-gradient(145deg,#4b9f70,#24543f);
  box-shadow:inset 0 0 25px #63d59622;
}

.home.yellow {
  inset:60% 0 0 60%;
  background:
    linear-gradient(145deg,#d2a936,#80621f);
  box-shadow:inset 0 0 25px #ffe27a22;
}

.yard {
  display:grid;
  grid-template:repeat(2,1fr)/repeat(2,1fr);
  gap:11%;
  width:100%;
  height:100%;
  padding:13%;
  border-radius:16%;
  background:#0d1019aa;
  border:1px solid #ffffff18;
  box-shadow:
    inset 0 0 18px #00000045,
    inset 0 1px 0 #ffffff0b;
  backdrop-filter:blur(3px);
}

.token {
  position:absolute;
  z-index:6;
  display:grid;
  place-items:center;

  width:76%;
  height:76%;
  left:12%;
  top:12%;

  border:2px solid #ffffffdd;
  border-radius:50%;

  color:#fff;
  font:800 clamp(7px,1vw,12px) monospace;

  cursor:default;

  background:
    radial-gradient(
      circle at 32% 27%,
      #ffffffaa 0 9%,
      transparent 10%
    ),
    radial-gradient(
      circle at 50% 55%,
      #ffffff22 0 35%,
      transparent 36%
    ),
    currentColor;

  box-shadow:
    inset 0 2px 3px #ffffff80,
    inset 0 -4px 5px #00000030,
    0 3px 0 #4d321f55,
    0 5px 9px #4d321f40;

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
}

.token.red {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#f58b80,#c94338);
}

.token.green {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#63b986,#27784e);
}

.token.yellow {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#f4d66a,#c39319);
}

.token.blue {
  background:
    radial-gradient(circle at 32% 27%, #ffffffaa 0 9%, transparent 10%),
    linear-gradient(145deg,#7198d2,#31588f);
}

.yard .token {
  position:relative;
  width:100%;
  height:100%;
  left:auto;
  top:auto;
}

.token.valid {
  cursor:pointer;
  outline:3px solid #fffbe4;
  outline-offset:4px;

  animation:selectablePiece 1s ease-in-out infinite;

  filter:brightness(1.12);

  transform:translateY(-4px) scale(1.08);

  box-shadow:
    0 0 0 6px #fff9dc88,
    inset 0 2px 3px #ffffff80,
    inset 0 -4px 5px #00000030,
    0 7px 0 #4d321f55,
    0 11px 15px #4d321f45;
}

.token.valid:hover {
  transform:translateY(-7px) scale(1.16);
  filter:brightness(1.2);
}

.token.valid:active {
  transform:translateY(0) scale(.92);
}

.token.valid:active {
  transform:translateY(0) scale(.94);
  transition:transform .08s ease;
}
@keyframes selectablePiece {
  0%,100% {
    transform:translateY(-3px) scale(1.05);
  }

  50% {
    transform:translateY(-6px) scale(1.1);
  }
}
.token:disabled {
  opacity:1;
}

.token.finished {
  background:
    radial-gradient(circle at 32% 27%,#ffffffaa 0 9%,transparent 10%),
    linear-gradient(145deg,#fff8d9,#e7c866)!important;

  color:#8b692d;

  border-color:#a77b32;

  box-shadow:
    inset 0 2px 3px #ffffffaa,
    inset 0 -3px 5px #00000018,
    0 3px 0 #80632955,
    0 5px 9px #4d321f30;
}
  
.yard .token {
  position:relative;
  width:100%;
  height:100%;
  left:auto;
  top:auto;
}

.token.finished {
  background:#fff5cf!important;
  color:#8b692d;
  border-color:#a77b32;
}

.stack-1 {
  margin-left:13%;
  margin-top:13%;
}

.stack-2 {
  margin-left:-13%;
  margin-top:13%;
}

.stack-3 {
  margin-left:13%;
  margin-top:-13%;
}
@keyframes selectablePiece {

  0%,100% {
    transform:translateY(-4px) scale(1.08);
    filter:brightness(1.1);
  }

  50% {
    transform:translateY(-8px) scale(1.13);
    filter:brightness(1.22);
  }

}
@keyframes pulse {
  50% {
    box-shadow:
      0 0 0 6px #fff9dc55,
      0 3px 0 #4d321f55;
  }
}
/* ANIMACIÓN DE FICHAS */
.token.moving-piece {
  animation: pieceMove .28s ease-out;
}

@keyframes pieceMove {
  0% {
    transform: scale(.82);
    opacity:.65;
  }

  60% {
    transform: scale(1.14);
    opacity:1;
  }

  100% {
    transform: scale(1);
    opacity:1;
  }
}
/* =========================================
   LLEGADA AL CENTRO — 2 PEQUEÑOS SALTOS
   ========================================= */

.token.arrived {
  animation: arrivalBounce 0.9s ease-out;
  z-index: 30;
}

@keyframes arrivalBounce {

  0% {
    transform: translateY(0) scale(1);
  }

  18% {
    transform: translateY(-9px) scale(1.08);
  }

  34% {
    transform: translateY(0) scale(1);
  }

  52% {
    transform: translateY(-6px) scale(1.05);
  }

  68% {
    transform: translateY(0) scale(1);
  }

  100% {
    transform: translateY(0) scale(1);
  }

}
/* =====================================================
   ANIMACIÓN DE CAPTURA
   ===================================================== */

.token.captured {
  z-index: 50 !important;
}

/* Señal visual de captura */
.capture-mark {
  position: fixed;
  z-index: 10000;
  pointer-events: none;

  width: 42px;
  height: 42px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background: #e53935;
  color: white;

  font-size: 25px;
  font-weight: 900;
  line-height: 1;

  border: 3px solid white;

  box-shadow:
    0 0 0 4px #e5393555,
    0 5px 14px #0006;

  transform: translate(-50%, -50%) scale(.2);
  opacity: 0;

  animation: captureMark 650ms cubic-bezier(.2,.8,.3,1) forwards;
}

/* La ficha capturada tiembla */
.token.captured {
  animation: capturedShake 500ms ease-in-out forwards;
}

@keyframes capturedShake {

  0% {
    transform: scale(1) rotate(0);
  }

  15% {
    transform: scale(1.15) rotate(-8deg);
  }

  30% {
    transform: scale(1.18) rotate(8deg);
  }

  45% {
    transform: scale(1.10) rotate(-5deg);
  }

  60% {
    transform: scale(1) rotate(3deg);
  }

  100% {
    transform: scale(1) rotate(0);
  }
}

@keyframes captureMark {

  0% {
    transform: translate(-50%, -50%) scale(.2) rotate(-15deg);
    opacity: 0;
  }

  20% {
    transform: translate(-50%, -50%) scale(1.25) rotate(5deg);
    opacity: 1;
  }

  35% {
    transform: translate(-50%, -50%) scale(1) rotate(0);
    opacity: 1;
  }

  70% {
    transform: translate(-50%, -70%) scale(1);
    opacity: 1;
  }

  100% {
    transform: translate(-50%, -95%) scale(.75);
    opacity: 0;
  }
}

/* Ficha que viaja lentamente hacia su casa */
.token.capture-flying {
  position: fixed !important;
  z-index: 9999 !important;
  pointer-events: none !important;
  margin: 0 !important;
  transition: none !important;
}

.legend {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px 18px;
  padding-top:14px;
  color:var(--muted);
  font-size:.7rem;
}

.legend span {
  display:flex;
  align-items:center;
  gap:5px;
}

.legend b {
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--safe);
}

.sidebar {
  display:grid;
  gap:14px;
}

.panel {
  padding:18px;
  border:1px solid #ffffff12;
  border-radius:20px;
  background:
    linear-gradient(145deg,#202535e8,#121621e8);
  box-shadow:
    0 16px 35px #00000035,
    inset 0 1px 0 #ffffff0b;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

.status-label {
  color:#9b8cff;

.status-player {

}

.orb {

.status-player strong,
.status-player small {

}

.status-player strong {

}

.status-player small {
  margin-top:3px;

  font-size:.72rem;
}

.dice-row {
  display:grid;
  grid-template-columns:68px 1fr;
  gap:14px;
  align-items:center;
  padding:14px;
  border:1px solid #ffffff12;
  border-radius:18px;
  background:linear-gradient(145deg,#1d2230,#151925);
  box-shadow:
    0 12px 28px #00000030,
    inset 0 1px 0 #ffffff0a;
}

.die {
  display:grid;
  grid-template:repeat(3,1fr)/repeat(3,1fr);
  gap:4px;
  width:68px;
  height:68px;
  padding:10px;
  border:1px solid #ffffff22;
  border-radius:18px;
  background:
    linear-gradient(145deg,#f8f9ff,#dfe3f0);
  box-shadow:
    0 10px 22px #00000045,
    inset 0 1px 2px #ffffff,
    inset 0 -3px 5px #00000018,

}

.pip {
  width:100%;
  height:100%;
  border-radius:50%;
  background:#20263a;
  opacity:0;
  box-shadow:
    inset 0 2px 2px #ffffff20,
    0 1px 2px #00000055;
  transform:scale(.92);
  transition:
    opacity .15s ease,
    transform .15s ease;
}

.pip.on {
  opacity:1;
  transform:scale(1);
}

.pip.on {
  opacity:1;
}

.rolling {
  animation:
    diceRoll .18s ease-in-out infinite,
    diceShake .55s ease-in-out infinite;
  transform-origin:center;
}

@keyframes diceRoll {
  0% {
    transform:rotate(0deg) scale(1);
  }

  25% {
    transform:rotate(18deg) scale(1.06);
  }

  50% {
    transform:rotate(-18deg) scale(1.1);
  }

  75% {
    transform:rotate(12deg) scale(1.06);
  }

  100% {
    transform:rotate(0deg) scale(1);
  }
}

@keyframes diceShake {
  0%,100% {
    filter:brightness(1);
  }

  50% {
    filter:brightness(1.12);
  }
}

.die.result {
  animation:diceResult .3s ease-out;
}

@keyframes diceResult {
  0% {
    transform:scale(.82) rotate(-8deg);
    opacity:.65;
  }

  55% {
    transform:scale(1.12) rotate(4deg);
    opacity:1;
  }

  100% {
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

.score-head {

.score-name {

.score-name span {

.score-dot {

/* CELEBRACIÓN AL COMPLETAR LAS 4 FICHAS */
.celebration {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  background: rgba(32,43,62,.45);
  animation: celebrationFade .35s ease-out;
}

.celebration-card {
  position: relative;
  width: min(90%, 430px);
  padding: 32px 24px;
  text-align: center;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 28px;
  box-shadow: 0 18px 50px rgba(32,43,62,.28);
  animation: celebrationPop .7s cubic-bezier(.2,.85,.3,1.25);
}

.celebration-trophy {
  font-size: 64px;
  line-height: 1;
  margin-bottom: 12px;
  animation: trophyBounce .9s ease-in-out infinite alternate;
}

.celebration-card h2 {
  margin: 0 0 8px;
  font-size: 30px;
}

.celebration-card p {
  margin: 0;
  color: var(--muted);
  font-size: 16px;
}

@keyframes celebrationFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes celebrationPop {
  0% {
    transform: scale(.55) rotate(-4deg);
    opacity: 0;
  }
  65% {
    transform: scale(1.08) rotate(1deg);
  }
  100% {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
}

@keyframes trophyBounce {
  from { transform: translateY(0) rotate(-4deg); }
  to { transform: translateY(-10px) rotate(4deg); }
}
/* =========================================
   CONFETI DE LLEGADA
   ========================================= */

.arrival-confetti {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  overflow: hidden;
  z-index: 99999;
}

.confetti-piece {
  position: absolute;
  top: -25px;
  width: 8px;
  height: 14px;
  display: block;
  opacity: 1;
  border-radius: 2px;
  animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {

  0% {
    transform: translateY(-25px) rotate(0deg);
    opacity: 1;
  }

  100% {
    transform:
      translate(
        var(--confetti-x),
        110vh
      )
      rotate(var(--confetti-r));

    opacity: 0;
  }

}

.finish{border-radius:12px;box-shadow:0 0 30px #8c7cff44,inset 0 0 20px #ffffff22}

/* Partida en celular */
@media (max-width:560px){
  .game-intro{padding:14px;margin-bottom:14px}
  .game-intro h1{font-size:1.5rem}
  .game-intro p{display:none}
  .turn-chip{margin-top:10px;font-size:.7rem}
  .cell.safe::before{font-size:9px}
  .token{font-size:7px}
  .dice-row{grid-template-columns:62px 1fr;padding:12px}
  .die{width:62px;height:62px;padding:9px}
}
/* Centrar encabezado de las tarjetas */
.setup-card-header{
  text-align:center;
}
.setup-card-kicker{
  text-align:center;
}
.gx-gate{
  position:fixed;inset:0;z-index:9999999;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:34px;
  background:radial-gradient(circle at 50% 45%,#6d21ff28 0,transparent 40%),#070911;
  cursor:pointer;
}
.gx-gate svg{width:min(45vw,220px);height:auto}
.gx-gate-text{
  color:#8e96a8;font:700 .75rem monospace;
  letter-spacing:.35em;
  animation:gxPulse 1.6s ease-in-out infinite;
}
@keyframes gxPulse{0%,100%{opacity:.35}50%{opacity:1}}
.lang-option{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:13px 14px;
  border:1px solid #ffffff12;border-radius:13px;
  background:#ffffff08;color:#fff;
  font-weight:700;font-size:.9rem;cursor:pointer;
}
.lang-option.selected{border-color:#8c7cffaa;background:#8c7cff22}
.lang-check{color:#b9aeff;font-weight:900}
.game-intro h1{
  letter-spacing:-.01em;
}
.finish{
  background:conic-gradient(
    from 45deg,
    #d9a928 0 25%,
    #368f60 25% 50%,
    #e53935 50% 75%,
    #426ba8 75% 100%
  );
}
/* DADO */
.die.six{
  box-shadow:0 0 0 2px #ffd54f88,0 0 16px #ffd54f66,0 10px 22px #00000045;
}

/* SALTO DE FICHA */
.token.hop{animation:tokenHop .18s ease-out}
@keyframes tokenHop{
  0%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-28%) scale(1.18)}
  100%{transform:translateY(0) scale(1)}
}

/* CONTADOR */
.score-value.full{color:#ffd54f}

/* META */
.finish.pulse{animation:finishPulse .9s ease-out}
@keyframes finishPulse{
  0%{box-shadow:0 0 0 0 #ffffff88,0 0 25px #8c7cff25}
  60%{box-shadow:0 0 0 22px #ffffff00,0 0 50px #ffe27a99}
  100%{box-shadow:0 0 0 0 #ffffff00,0 0 25px #8c7cff25}
}
/* RENDIMIENTO ANDROID */
.panel,.game-intro,.settings-button,.settings-overlay,
.winner,.yard,.settings-panel,.setup-card-modern{
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}
.settings-overlay{background:rgba(5,6,12,.88)}
.winner{background:rgba(5,6,12,.92)}

.setup-modern::before,
.setup-card-modern::before,
.setup-card-glow,
.board-frame::before{display:none}

.token.valid{filter:none}
@keyframes selectablePiece{
  0%,100%{transform:translateY(-3px) scale(1.05)}
  50%{transform:translateY(-6px) scale(1.1)}
}

.gx-name{will-change:auto}
/* RENDIMIENTO 2 */
.cell{box-shadow:none!important}
.cell.track{background:#242a3b}
.cell.lane-red{background:#8f3541}
.cell.lane-green{background:#2f7653}
.cell.lane-yellow{background:#9a7a28}
.cell.lane-blue{background:#41598f}
.cell.start-red{background:#c94449}
.cell.start-green{background:#3f9568}
.cell.start-yellow{background:#c49a35}
.cell.start-blue{background:#5273ac}

.rolling{animation:diceRoll .18s ease-in-out infinite}
.pip{transition:none}
/* TACTO ANDROID */
html,body{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.token{will-change:transform}
@media (hover:none){
  .roll-button:hover,.primary-button:hover,.secondary-button:hover,
  .mode-card:hover,.player-count-card:hover,.color-card:hover,
  .settings-option:hover{
    transform:none;
    filter:none;
  }
}
/* CUENTAS */
.auth-field{position:relative;z-index:2;display:grid;gap:6px;margin-bottom:12px;text-align:left}
.auth-field label{color:#9aa3b8;font:700 .62rem monospace;letter-spacing:.12em;text-transform:uppercase}
.auth-input{display:flex;align-items:center;border:1px solid #ffffff14;border-radius:14px;background:#ffffff08;transition:border-color .2s}
.auth-input:focus-within{border-color:#8c7cffaa}
.auth-input input{flex:1;min-width:0;padding:15px 14px;border:0;outline:0;background:transparent;color:#fff;font-size:16px;font-weight:600;font-family:inherit}
.auth-input input::placeholder{color:#596275}
.auth-eye{border:0;background:transparent;color:#9aa3b8;font-size:18px;padding:0 14px;cursor:pointer}
.auth-error,.auth-notice{position:relative;z-index:2;margin:0 0 12px;padding:10px 12px;border-radius:12px;font-size:.8rem;text-align:left}
.auth-error{background:#e5393518;border:1px solid #e5393540;color:#ff9a9a}
.auth-notice{background:#368f6020;border:1px solid #368f6050;color:#8be3b3}
.auth-links{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:14px 0 4px}
.auth-link{border:0;background:transparent;color:#a99dff;font-weight:700;font-size:.82rem;cursor:pointer;padding:6px 2px}
.auth-guest{position:relative;z-index:2;width:100%;margin-top:12px}
.account-box{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #ffffff12}
.account-info{display:flex;align-items:center;gap:12px;padding:6px 8px 10px}
.account-avatar{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#8c7cff26,#ffffff0a);border:1px solid #ffffff10;font-size:20px}
.account-info strong{display:block;color:#fff;font-size:.86rem;word-break:break-all}
.account-info small{color:#8e97aa;font-size:.68rem}

/* PERFIL */
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avatar-pick{aspect-ratio:1;display:grid;place-items:center;font-size:26px;border:1px solid #ffffff14;border-radius:14px;background:#ffffff08;cursor:pointer;transition:border-color .2s,transform .15s}
.avatar-pick.selected{border-color:#8c7cffcc;background:#8c7cff26;transform:scale(1.04)}
.profile-hint{position:relative;z-index:2;margin:-4px 0 14px;color:#8e97aa;font-size:.72rem;text-align:left}
.profile-name{padding:14px;border:1px solid #ffffff14;border-radius:14px;background:#ffffff08;color:#fff;font-weight:700}
/* ESTADÍSTICAS */
.trophy-big{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 12px;padding:16px;border:1px solid #ffd54f44;border-radius:18px;background:linear-gradient(145deg,#ffd54f1f,#ffffff08)}
.trophy-big b{font-size:2rem;color:#ffd54f;line-height:1}
.trophy-big span{color:#c9b36a;font:800 .64rem monospace;letter-spacing:.14em;text-transform:uppercase}
.stats-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat{padding:12px;border:1px solid #ffffff12;border-radius:14px;background:#ffffff08;text-align:left}
.stat b{display:block;color:#fff;font-size:1.15rem}
.stat span{color:#8e97aa;font:700 .58rem monospace;letter-spacing:.1em;text-transform:uppercase}
.trophy-line{margin:12px 0 0;font-weight:900;font-size:1.3rem}
.trophy-line.up{color:#ffd54f}
.trophy-line.down{color:#ff9a9a}

/* ===== GREYX HOME REDESIGN ===== */
.gx-home {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding: 8px 0 36px;
  color: #f5f5ff;
}

.gx-hero {
  text-align: center;
  position: relative;
  padding: 4px 0 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.gx-title {
  margin: 6px 0 0;
  font-size: clamp(3.2rem, 14vw, 4.4rem);
  line-height: .88;
  font-weight: 900;
  letter-spacing: -.04em;
  color: #e8eaf2;
  text-shadow: 0 6px 24px #00000099;
}

.gx-title span {
  display: block;
  margin-top: 2px;
  color: #7c3aed;
  text-shadow: 0 4px 18px #00000088;
}

@media (max-width: 560px) {
  .gx-title {
    font-size: clamp(2.9rem, 15vw, 3.8rem);
  }
}

.gx-board-art {
  display: grid;
  place-items: center;
  width: 100%;
  margin: 10px auto 0;
  padding: 8px 0;
}

.gx-board {
  width: min(260px, 72vw);
  aspect-ratio: 1;
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 6px;
  padding: 10px;
  transform: rotate(-7deg);
  border-radius: 22px;
  background: linear-gradient(145deg, #f0f4ff, #dce6ff);
  box-shadow:
    0 0 0 3px #5a70ff88,
    0 0 40px #4a47ff66,
    0 20px 50px #00000066;
}

.gx-home-zone {
  border-radius: 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 5px;
  padding: 8px;
}
.gx-home-zone i {
  border-radius: 50%;
  background: #ffffff55;
  box-shadow: inset 0 1px 2px #00000022;
}
.gx-home-red { background: linear-gradient(135deg, #c9183a, #ff4d6d); }
.gx-home-blue { background: linear-gradient(135deg, #1d4ed8, #3b82f6); }
.gx-home-green { background: linear-gradient(135deg, #047857, #10b981); }
.gx-home-yellow { background: linear-gradient(135deg, #b45309, #fbbf24); }

.gx-token {
  position: absolute;
  z-index: 2;
  width: 28px;
  height: 28px;
  border: 2.5px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 14px currentColor, 0 4px 10px #00000055;
  transform: rotate(7deg);
}
.gx-red { top: 14%; left: 14%; background: #ef4444; color: #ef4444; }
.gx-blue { top: 14%; right: 14%; background: #3b82f6; color: #3b82f6; }
.gx-green { bottom: 14%; left: 14%; background: #10b981; color: #10b981; }
.gx-yellow { bottom: 14%; right: 14%; background: #f59e0b; color: #f59e0b; }

.gx-dice {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 50%;
  width: 52px;
  height: 52px;
  margin: -26px 0 0 -26px;
  border-radius: 14px;
  background: linear-gradient(145deg, #ffffff, #e2e8f0);
  border: 2px solid #6366f1;
  box-shadow: 0 8px 22px #00000066, 0 0 18px #6366f155;
  transform: rotate(7deg);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  place-items: center;
  padding: 8px;
  gap: 2px;
}
.gx-dice span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #1e1b4b;
}
.gx-dice span:nth-child(1) { grid-column: 1; grid-row: 1; }
.gx-dice span:nth-child(2) { grid-column: 3; grid-row: 1; }
.gx-dice span:nth-child(3) { grid-column: 2; grid-row: 2; }
.gx-dice span:nth-child(4) { grid-column: 1; grid-row: 3; }
.gx-dice span:nth-child(5) { grid-column: 3; grid-row: 3; }

.gx-ready {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 18px;
  padding: 11px 22px;
  border: 1px solid #526cff88;
  border-radius: 999px;
  color: #c4e8ff;
  background: linear-gradient(135deg, #0b1630ee, #0a1024ee);
  box-shadow: 0 0 20px #254eff44, inset 0 1px 0 #ffffff12;
  font-size: .62rem;
  font-weight: 800;
  letter-spacing: .14em;
}

.gx-ready-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 10px #22c55e;
}

.gx-section-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 22px 0 14px;
}

.gx-section-title h2 {
  margin: 0;
  font-size: .78rem;
  letter-spacing: .16em;
  text-align: center;
  font-weight: 800;
  color: #e2e8f0;
}

.gx-section-title span {
  width: 28px;
  height: 2px;
  background: #7c3aed;
  box-shadow: 0 0 10px #7c3aed;
}

.gx-modes {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.gx-mode {
  min-width: 0;
  min-height: 150px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 6px;
  padding: 14px 12px 28px;
  overflow: hidden;
  border: 1.5px solid #334155;
  border-radius: 18px;
  color: #f8f8ff;
  text-align: left;
  background: linear-gradient(160deg, #1a2238, #0d1224 80%);
  box-shadow: 0 8px 24px #00000044, inset 0 1px 0 #ffffff10;
}

button.gx-mode {
  cursor: pointer;
  font: inherit;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}

button.gx-mode:active {
  transform: scale(.97);
}

.gx-mode-local {
  border-color: #22d3eeaa;
  box-shadow: 0 0 18px #06b6d433, inset 0 1px 0 #ffffff14;
}

.gx-mode-ai {
  border-color: #a78bfaaa;
  box-shadow: 0 0 18px #8b5cf633, inset 0 1px 0 #ffffff14;
}

.gx-mode-icon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  color: #67e8f9;
  margin-bottom: 2px;
}
.gx-mode-icon svg {
  width: 26px;
  height: 26px;
  display: block;
}
.gx-mode-ai .gx-mode-icon { color: #c4b5fd; }
.gx-mode-online .gx-mode-icon { color: #94a3b8; }

.gx-mode strong {
  font-size: .72rem;
  line-height: 1.2;
  font-weight: 900;
  letter-spacing: .02em;
}

.gx-mode small {
  color: #94a3b8;
  font-size: .58rem;
  line-height: 1.35;
  flex: 1;
}

.gx-mode-arrow {
  position: absolute;
  right: 10px;
  bottom: 8px;
  color: #64748b;
  font-size: 1.15rem;
  font-weight: 300;
}
.gx-mode-local .gx-mode-arrow { color: #22d3ee; }
.gx-mode-ai .gx-mode-arrow { color: #a78bfa; }

.gx-disabled {
  opacity: .7;
  border-color: #475569;
  cursor: not-allowed;
}

.gx-coming {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 3px 7px;
  border-radius: 999px;
  color: #fff;
  background: #6366f1;
  font-size: .48rem;
  font-weight: 800;
  letter-spacing: .06em;
}

.gx-progress {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid #334155;
  background: linear-gradient(145deg, #1a2238cc, #0d1224cc);
  box-shadow: 0 8px 24px #00000044;
}
.gx-level {
  flex: 0 0 auto;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(145deg, #7c3aed, #5b21b6);
  box-shadow: 0 0 16px #7c3aed55, inset 0 1px 0 #ffffff33;
  text-align: center;
  line-height: 1;
}
.gx-level span {
  display: block;
  font: 800 .45rem/1 monospace;
  letter-spacing: .08em;
  color: #ddd6fe;
}
.gx-level strong {
  font-size: 1.1rem;
  color: #fff;
}
.gx-progress-body { flex: 1; min-width: 0; }
.gx-progress-title {
  font: 800 .58rem/1 monospace;
  letter-spacing: .12em;
  color: #e2e8f0;
  margin-bottom: 6px;
}
.gx-progress-stats {
  display: flex;
  gap: 12px;
  margin-bottom: 6px;
  color: #94a3b8;
  font-size: .58rem;
}
.gx-progress-stats b { color: #fff; font-weight: 800; }
.gx-xp {
  display: flex;
  align-items: center;
  gap: 8px;
}
.gx-xp-bar {
  flex: 1;
  height: 5px;
  border-radius: 99px;
  background: #1e293b;
  overflow: hidden;
}
.gx-xp-bar i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #22d3ee, #a78bfa);
}
.gx-xp span {
  font: 700 .52rem monospace;
  color: #64748b;
  white-space: nowrap;
}

@media (max-width: 560px) {
  .gx-home {
    padding-top: 4px;
    padding-bottom: 24px;
  }

  .gx-modes {
    gap: 8px;
  }

  .gx-mode {
    min-height: 138px;
    padding: 12px 10px 26px;
  }

  .gx-mode strong {
    font-size: .65rem;
  }

  .gx-mode small {
    font-size: .52rem;
  }

  .gx-section-title h2 {
    font-size: .7rem;
  }
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar-btn {
  width: 42px;
  height: 42px;
  display: grid;

  border: 1px solid #ffffff18;

  background: #ffffff0c;
  color: #e2e8f0;

  box-shadow: 0 4px 14px #00000040;
}
.topbar-btn:active { transform: scale(.96); }


.friends-header h1 {

.friends-back {

.friends-header-spacer { width: 42px; }

.friends-search-wrap { margin-bottom: 18px; }
.friends-search {

.friends-section h2 {

.top-action-friends {

.friend-result-avatar {

.friend-result-info {

}
.friend-result-info small {

}
.friend-result-btn {

/* ===== AMIGOS — UI PREMIUM ===== */
.friends-screen {
  width: min(440px, 100%);
  margin: 0 auto;
  min-height: calc(100vh - 24px);
  padding: 6px 6px 48px;
  color: #f1f5f9;
}

.friends-header {

.mm-top h1 { margin: 0; font-size: 1.1rem; font-weight: 900; }
.mm-timer {
  font-size: 3.8rem;
  font-weight: 900;
  letter-spacing: .04em;
  color: #e2e8f0;
  margin: 24px 0 8px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 40px #7c3aed55;
}
.mm-status {
  color: #94a3b8;
  font-size: .82rem;
  margin-bottom: 18px;
  min-height: 22px;
}
.mm-globe {
  font-size: 4.5rem;
  margin: 8px auto 0;
  display: block;
  animation: mmSpin 12s linear infinite;
}
@keyframes mmSpin {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}
.mm-bar-wrap {
  margin: 18px 0 10px;
  height: 6px;
  border-radius: 99px;
  background: #1e293b;
  overflow: hidden;
}
.mm-bar {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #22d3ee, #a78bfa);
  transition: width .5s linear;
}
.mm-found {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 10px 0;
  color: #22c55e;
  font: 800 .78rem monospace;
  letter-spacing: .08em;
}
.mm-found-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 10px #22c55e;
}
.mm-count-pills {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 14px 0;
}
.mm-pill {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1.5px solid #334155;
  background: #0f172a;
  color: #94a3b8;
  font: 700 .72rem monospace;
  cursor: pointer;
  transition: border-color .18s, color .18s;
}
.mm-pill.selected {
  border-color: #7c3aed;

}

/* SALA CON AMIGOS */
.room-screen {

.room-top {
  display: grid;

.room-top h1 { margin: 0; text-align: center; font-size: 1.1rem; font-weight: 900; }
.room-name-edit {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 16px;

  border: 1.5px solid #7c3aed66;

.room-slot.blue { border-color: #3b82f688; background: #3b82f60f; color: #93c5fd; }

.room-invite-btn {

  font: 800 .85rem inherit;

  margin-bottom: 14px;
  transition: border-color .18s, background .18s;
}
.room-invite-btn:active { background: #7c3aed11; }

  min-height: 56px;
  border-radius: 18px;
  border: 0;
  background: linear-gradient(135deg, #8b5cf6, #6d28d9);
  color: #fff;

  letter-spacing: .04em;

/* ===== XP Y NIVELES ===== */
.xp-popup {
  position: fixed;
  z-index: 99998;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  animation: xpFloat 2.8s cubic-bezier(.2,.8,.2,1) forwards;
}
.xp-popup-badge {
  padding: 8px 18px;
  border-radius: 999px;
  background: linear-gradient(135deg, #7c3aed, #4f46e5);
  border: 2px solid #a78bfa;
  color: #fff;
  font: 900 1.1rem monospace;
  letter-spacing: .04em;
  box-shadow: 0 0 24px #7c3aed88, 0 8px 20px #00000055;
}
.xp-popup-label {
  color: #c4b5fd;
  font: 700 .65rem monospace;
  letter-spacing: .14em;
}
@keyframes xpFloat {
  0%   { opacity:0; transform:translateY(0) scale(.7); }
  15%  { opacity:1; transform:translateY(-10px) scale(1.08); }
  40%  { opacity:1; transform:translateY(-32px) scale(1); }
  80%  { opacity:1; transform:translateY(-60px) scale(1); }
  100% { opacity:0; transform:translateY(-90px) scale(.9); }
}

.levelup-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: grid;
  place-items: center;
  background: #00000088;
  animation: fadeInOut 3.2s ease forwards;
}
@keyframes fadeInOut {
  0%   { opacity:0; }
  12%  { opacity:1; }
  75%  { opacity:1; }
  100% { opacity:0; }
}
.levelup-card {
  text-align: center;
  padding: 32px 28px;
  border-radius: 28px;
  background: linear-gradient(145deg, #1e1b4b, #0f172a);
  border: 2px solid #a78bfa;
  box-shadow: 0 0 60px #7c3aed66, 0 30px 60px #00000077;
  animation: levelupPop 3.2s cubic-bezier(.2,.85,.3,1.2) forwards;
}
@keyframes levelupPop {
  0%   { transform:scale(.5) rotate(-4deg); opacity:0; }
  18%  { transform:scale(1.08) rotate(1deg); opacity:1; }
  30%  { transform:scale(1) rotate(0); }
  75%  { transform:scale(1); opacity:1; }
  100% { transform:scale(.9); opacity:0; }
}
.levelup-star { font-size: 3rem; margin-bottom: 8px; }
.levelup-title {
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .18em;
  color: #a78bfa;
  margin-bottom: 6px;
}
.levelup-num {
  font-size: 4rem;
  font-weight: 900;
  color: #fff;
  line-height: 1;
  text-shadow: 0 0 30px #a78bfa;
}
.levelup-sub {
  color: #94a3b8;
  font-size: .8rem;
  margin-top: 8px;
}

.xp-bar-wrap {
  margin: 6px 0 0;
  height: 5px;
  border-radius: 99px;
  background: #1e293b;
  overflow: hidden;
}
.xp-bar-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #7c3aed, #22d3ee);
  transition: width .6s ease;
}
.xp-next-label {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font: 700 .58rem monospace;
  color: #64748b;
}

  oscillator.start(ctx.currentTime + delay);
  oscillator.stop(ctx.currentTime + delay + duration + 0.03);

}

let musicGain = null;
let musicTimer = null;
let musicMode = null;
let musicStep = 0;
let nextNoteTime = 0;

const musicSets = {
  menu: {
    bpm: 84,
    chords: [
      [220.00, 261.63, 329.63],
      [174.61, 220.00, 261.63],
      [261.63, 329.63, 392.00],
      [196.00, 246.94, 293.66]
    ]
  },
  game: {
    bpm: 108,
    chords: [
      [196.00, 233.08, 293.66],
      [155.56, 196.00, 233.08],
      [233.08, 293.66, 349.23],
      [174.61, 220.00, 261.63]
    ]
  }
};

function getMusicGain() {
  const ctx = getAudioContext();
  if (!musicGain) {
    musicGain = ctx.createGain();
    musicGain.gain.value = 1;
    musicGain.connect(getMaster());
  }
  return musicGain;
}

function musicNote(freq, when, dur, type, vol) {
  const ctx = getAudioContext();
  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.type = type;
  o.frequency.value = freq;

  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);

  o.connect(g);
  g.connect(getMusicGain());
  o.start(when);
  o.stop(when + dur + 0.05);
}

function scheduleMusic() {
  const set = musicSets[musicMode];
  if (!set) return;

  const ctx = getAudioContext();
  const stepDur = 60 / set.bpm / 2;
  if (nextNoteTime < ctx.currentTime) nextNoteTime = ctx.currentTime + 0.05;

  while (nextNoteTime < ctx.currentTime + 0.3) {
    const bar = Math.floor(musicStep / 8) % set.chords.length;
    const pos = musicStep % 8;
    const chord = set.chords[bar];

    if (pos === 0) {
      chord.forEach(f => musicNote(f / 2, nextNoteTime, stepDur * 8, "sine", 0.022));
    }

    const arp = [0, 1, 2, 1, 2, 1, 0, 1][pos];
    musicNote(chord[arp] * 2, nextNoteTime, stepDur * 1.6, "triangle", 0.014);

    nextNoteTime += stepDur;
    musicStep++;
  }
}

function stopMusic() {
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  musicMode = null;

  if (musicGain) {
    const ctx = getAudioContext();
    musicGain.gain.cancelScheduledValues(ctx.currentTime);
    musicGain.gain.setValueAtTime(musicGain.gain.value, ctx.currentTime);
    musicGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
  }
}

function startMusic(mode) {
  if (!state.music || !audioUnlocked) return;
  if (musicMode === mode) return;

  const wasPlaying = musicMode !== null;
  stopMusic();
  musicMode = mode;

  setTimeout(() => {
    if (musicMode !== mode) return;

    const ctx = getAudioContext();
    const g = getMusicGain();

    g.gain.cancelScheduledValues(ctx.currentTime);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.5);

    musicStep = 0;
    nextNoteTime = ctx.currentTime + 0.1;
    musicTimer = setInterval(scheduleMusic, 100);
  }, wasPlaying ? 550 : 0);
}

function syncMusic() {
  if (!audioUnlocked) return;

  if (!state.music) {
    if (musicMode) stopMusic();
    return;
  }

  startMusic(state.phase === "playing" ? "game" : "menu");
}

  [/^No hay movimientos válidos para (.+)\.$/, { en:"No valid moves for $1.", pt:"Não há movimentos válidos para $1." }],
  [/^(.+) está eligiendo una ficha…$/, { en:"$1 is choosing a piece…", pt:"$1 está escolhendo uma peça…" }],
  [/^¡Increíble partida, (.+)!$/, { en:"Amazing game, $1!", pt:"Que partida incrível, $1!" }],
  [/^¡Gana (.+)!$/, { en:"$1 wins!", pt:"$1 venceu!" }]
];

function translateText(str, lang) {
  const key = str.replace(/\s+/g, " ").trim();
  if (!key) return null;

  const d = DICT[lang];
  if (d && d[key]) return d[key];

  for (const [re, out] of PATTERNS) {
    if (re.test(key)) return key.replace(re, out[lang]);
  }
  return null;
}

function translateDOM(root) {
  const lang = state.lang;
  if (!root || lang === "es") return;

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach(n => {
    const r = translateText(n.nodeValue, lang);
    if (r !== null) n.nodeValue = r;
  });

  root.querySelectorAll("[placeholder],[aria-label]").forEach(el => {
    ["placeholder", "aria-label"].forEach(a => {
      if (!el.hasAttribute(a)) return;
      const r = translateText(el.getAttribute(a), lang);
      if (r !== null) el.setAttribute(a, r);
    });
  });
}

function coord(color, progress) {
  if (progress < 0 || progress > 57) {
    return null;
  }

  // Meta central
  if (progress === 57) {
    return [7,7];
  }

  let cell;

  if (progress <= 51) {
    cell = track[
      (startIndex[color] + progress) % track.length
    ];
  } else {
    cell = lanes[color][progress - 52] || null;
  }

  if (!cell) {
    return null;
  }

  return cell;
}

function trackIndex(color, progress) {
  if (progress >= 0 && progress <= 51) {
    return (
      startIndex[color] + progress
    ) % track.length;
  }

  return null;
}
const DIE_POS = {
  1:[4], 2:[0,8], 3:[0,4,8],

};

function startDieFlicker() {
  dieFlicker = setInterval(() => {
    const n = Math.floor(Math.random() * 6) + 1;
    document.querySelectorAll(".die .pip").forEach((p, i) => {
      p.classList.toggle("on", DIE_POS[n].includes(i));
    });
  }, 80);
}

function stopDieFlicker() {
  if (dieFlicker) { clearInterval(dieFlicker); dieFlicker = null; }
}

function morphInto(root, html) {
  const box = document.createElement("div");
  box.innerHTML = html;
  if (typeof translateDOM === "function") translateDOM(box);
  patchChildren(root, box);
}

function patchChildren(oldParent, newParent) {
  const oldKids = Array.from(oldParent.childNodes);
  const newKids = Array.from(newParent.childNodes);
  const max = Math.max(oldKids.length, newKids.length);

  for (let i = 0; i < max; i++) {
    const o = oldKids[i];
    const n = newKids[i];
    if (!n) { oldParent.removeChild(o); continue; }
    if (!o) { oldParent.appendChild(n); continue; }
    patchNode(o, n);
  }
}

function patchNode(o, n) {
  if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName) {
    o.replaceWith(n);
    return;
  }

  if (o.nodeType !== 1) {
    if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue;
    return;
  }

  if (o.getAttribute("data-key") !== n.getAttribute("data-key")) {
    o.replaceWith(n);
    return;
  }

  if (
    o.nodeName === "BUTTON" &&
    n.hasAttribute("data-token") &&
    (o.getAttribute("data-token") !== n.getAttribute("data-token") ||
     o.getAttribute("data-color") !== n.getAttribute("data-color"))
  ) {
    o.replaceWith(n);
    return;
  }

  Array.from(o.attributes).forEach(a => {
    if (!n.hasAttribute(a.name)) o.removeAttribute(a.name);
  });
  Array.from(n.attributes).forEach(a => {
    if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value);
  });

  if (o.nodeName === "INPUT") {
    const v = n.getAttribute("value") || "";
    if (o.value !== v) o.value = v;
  }

  patchChildren(o, n);
}

function authErrorText(code) {
  switch (code) {
    case "auth/invalid-email": return AUTH_MSG.email;
    case "auth/email-already-in-use": return AUTH_MSG.exists;
    case "auth/weak-password":
    case "auth/password-does-not-meet-requirements": return AUTH_MSG.weak;
    case "auth/invalid-credential":
    case "auth/user-not-found":
    case "auth/wrong-password": return AUTH_MSG.bad;
    case "auth/too-many-requests": return AUTH_MSG.many;
    case "auth/network-request-failed": return AUTH_MSG.net;
    default: return AUTH_MSG.generic;
  }
}

async function initFirebase() {
  try {
    const [appMod, authMod] = await Promise.all([
      import(FB_BASE + "firebase-app.js"),
      import(FB_BASE + "firebase-auth.js")
    ]);
    const fbApp = appMod.initializeApp(firebaseConfig);
    const auth = authMod.getAuth(fbApp);
    fb = {
      auth,
      createUserWithEmailAndPassword: authMod.createUserWithEmailAndPassword,
      signInWithEmailAndPassword: authMod.signInWithEmailAndPassword,
      sendPasswordResetEmail: authMod.sendPasswordResetEmail,
      sendEmailVerification: authMod.sendEmailVerification,
      signOut: authMod.signOut
    };
        try {
      await authMod.setPersistence(auth, authMod.browserLocalPersistence);
    } catch (e) {
      console.warn("No se pudo fijar la persistencia:", e);
    }
    authMod.onAuthStateChanged(auth, onAuthChange);
  } catch (e) {
    console.warn("Firebase no disponible:", e);
    state.authOffline = true;
    state.authReady = true;
    if (state.introDone) { decideAuthScreen(); render(); }
  }
}

function onAuthChange(user) {
  state.user = user
    ? { uid: user.uid, email: user.email, emailVerified: user.emailVerified }
    : null;
  state.authReady = true;

  if (user) {
    state.showAuth = false;
    state.authPass = "";
    state.authPass2 = "";
    state.authError = "";
  } else if (state.introDone) {
    decideAuthScreen();
  }
  if (state.introDone) render();
}

function decideAuthScreen() {
  if (state.phase === "playing") return;
  if (state.user) { state.showAuth = false; return; }
  let guest = false;
  try { guest = localStorage.getItem("gx-guest") === "1"; } catch (e) {}
  state.showAuth = !guest && !state.authOffline;
}

function failAuth(msg) {
  state.authError = msg;
  state.authLoading = false;
  render();
}

async function submitAuth() {
  if (state.authLoading) return;
  const mode = state.authMode;
  const email = state.authEmail.trim().toLowerCase();
  const pass = state.authPass;

  state.authError = "";
  state.authNotice = "";

  if (!fb) return failAuth(AUTH_MSG.net);
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return failAuth(AUTH_MSG.email);

  if (mode !== "reset") {
    if (!pass) return failAuth(AUTH_MSG.needPass);
    if (mode === "register") {
      if (pass.length < 8) return failAuth(AUTH_MSG.short);
      if (pass !== state.authPass2) return failAuth(AUTH_MSG.match);
    }
  }

  state.authLoading = true;
  render();

  try {
    if (mode === "register") {
      const cred = await fb.createUserWithEmailAndPassword(fb.auth, email, pass);
      try { await fb.sendEmailVerification(cred.user); } catch (e) {}
    } else if (mode === "login") {
      await fb.signInWithEmailAndPassword(fb.auth, email, pass);
    } else {
      await fb.sendPasswordResetEmail(fb.auth, email);
    }

    state.authLoading = false;
    if (mode === "reset") {
      state.authNotice = AUTH_MSG.resetSent;
    } else {
      state.showAuth = false;
      state.authPass = "";
      state.authPass2 = "";
    }
    render();

  } catch (e) {
    const code = e && e.code ? e.code : "";
    state.authLoading = false;

    const real = ["auth/network-request-failed", "auth/too-many-requests", "auth/invalid-email"];
    if (mode === "reset" && !real.includes(code)) {
      state.authNotice = AUTH_MSG.resetSent;
    } else {
      state.authError = authErrorText(code) + (code ? " [" + code + "]" : "");
    }
    render();
  }
}

function handleAuthAction(action) {
  switch (action) {

    case "auth-open":
  state.settingsOpen = false;
  state.confirmAction = null;
  state.showFriends = false;
  state.showAuth = true;
  state.authMode = "login";
  state.authError = "";
  state.authNotice = "";
  render();
  return true;

    case "auth-guest":
      try { localStorage.setItem("gx-guest", "1"); } catch (e) {}
      state.showAuth = false;
      state.authError = "";
      state.authNotice = "";
      render();
      return true;

    case "auth-mode-login":
    case "auth-mode-register":
    case "auth-mode-reset":
      state.authMode = action.replace("auth-mode-", "");
      state.authError = "";
      state.authNotice = "";
      state.authPass2 = "";
      render();
      return true;

    case "auth-toggle-pass":
      state.showPass = !state.showPass;
      render();
      return true;

    case "auth-submit":
      submitAuth();
      return true;

    case "auth-logout":
      if (state.confirmAction !== "auth-logout") {
        state.confirmAction = "auth-logout";
        render();
        return true;
      }
      state.confirmAction = null;
      state.settingsOpen = false;
      try { localStorage.removeItem("gx-guest"); } catch (e) {}
      if (fb) fb.signOut(fb.auth).catch(() => {});
      state.authMode = "login";
      state.authError = "";
      state.showAuth = true;
      render();
      return true;
  }
  return false;
}

function setupAuthInputs() {
  app.addEventListener("input", e => {
    if (e.target && e.target.dataset && e.target.dataset.friendsSearch) {
  queueFriendsSearch(e.target.value);
}
    const f = e.target && e.target.dataset && e.target.dataset.authField;
    if (!f) return;
    if (f === "email") state.authEmail = e.target.value;
    if (f === "pass") state.authPass = e.target.value;
    if (f === "pass2") state.authPass2 = e.target.value;
    if (e.target && e.target.dataset && e.target.dataset.roomName) {
  state.roomName = e.target.value;
}

  });

  app.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target && e.target.dataset && e.target.dataset.authField) {
      e.preventDefault();
      submitAuth();
    }
  });
}

function mergeAuthI18n() {
  try {

function render() {

  const html = `

  <div class="shell">

    ${logoHeader()}

    <div class="view" style="display:contents" data-key="${state.phase}-${state.setupStep}-${state.mode}">
      ${
        state.phase==="setup"
        ?
        setupMarkup()
        :
        gameMarkup()
      }
    </div>

    ${settingsMarkup()}

  </div>

  ${
    state.celebrating
    ?
    celebrationMarkup()
    :
    state.phase==="winner"
    ?
    winnerMarkup()
    :
    ""
  }

  `;

  morphInto(app, html);

  if (state.lang) document.documentElement.lang = state.lang;

  bind();
  syncMusic();
}

function bind(root = app) {

  root.querySelectorAll("[data-action]")
    .forEach(button => {
            if (button._bound) return;
      button._bound = true;

      button.addEventListener("click", () => {

        const action = button.dataset.action;
playUiSound(action);
if (handleAuthAction(action) || handleProfileAction(action) || handleOnlineAction(action, button)) return;
if (action === "friends-open") {
  state.showFriends = true;
  state.settingsOpen = false;
  state.friendsSearch = "";
  state.friendsResults = [];
  state.friendsSearchNote = "";
  render();
  loadFriendRequests();
  loadFriendsList();
  return;
}
if (action === "friends-back") {
  state.showFriends = false;
  state.friendsSearch = "";
  state.friendsResults = [];
  state.friendsSearchNote = "";
  render();
  return;
}

if (action === "friend-request") {
  const uid = button.dataset.uid;
  const name = button.dataset.username || "";
  if (uid) sendFriendRequest(uid, name);
  return;
}
if (action === "settings-view") {
  state.settingsView = button.dataset.view;
  render();
  return;
}
if (action === "settings-back") {
  state.settingsView = null;
  render();
  return;
}
if (action === "settings-exit") {
  state.settingsOpen = false;
  state.settingsView = null;
  state.confirmAction = null;
  render();
  return;
}
if (action === "player-open") { openPlayer(button.dataset.uid); return; }
if (action === "player-close") { state.viewPlayer = null; render(); return; }
if (action === "player-copy") { copyPlayerId(button.dataset.uid); return; }
if (action === "friends-tab") {
  state.friendsTab = button.dataset.tab;
  render();
  return;
}

if (action === "friend-accept") {
  const id = button.dataset.id;
  if (id) acceptFriendRequest(id);
  return;
}

if (action === "friend-reject") {
  const id = button.dataset.id;
  if (id) rejectFriendRequest(id);
  return;
}

if (action === "settings-language") {
  state.languageOpen = true;
  render();
}

if (action === "close-language") {
  state.languageOpen = false;
  render();
}

if (action === "set-lang") {
  state.lang = button.dataset.lang;
  try { localStorage.setItem("gx-lang", state.lang); } catch (e) {}
  render();
}


if (action === "settings-music") {
  state.music = !state.music;
  render();
}

        if (action === "settings") {
          state.settingsOpen = true;

function start(count) {

      .slice(0, state.botCount);

    ];

    state.count = state.players.length;

  } else {

    ];

  state.moving = false;

    state.mode === "solo"
      ? "Tu turno. Lanza el dado para comenzar."
      : "Lanza el dado para comenzar. Un seis saca una ficha de casa.";

}

function canMove(token,n) {

return token.progress===-1

?

n===6

:

token.progress!==57 &&
token.progress+n<=57;

}

function chooseBotMove(color) {
  const options = [];

  state.tokens[color].forEach(token => {
    if (!canMove(token, state.roll)) return;

    const finalProgress =
      token.progress === -1
      ? 0
      : token.progress + state.roll;

    let score = finalProgress;

    if (token.progress === -1) score += 40;
    if (finalProgress === 57) score += 200;

    const landing = trackIndex(color, finalProgress);

    if (landing !== null && !safe.has(landing)) {
      state.players
        .filter(opponent => opponent !== color)
        .forEach(opponent => {
          state.tokens[opponent].forEach(enemy => {
            if (trackIndex(opponent, enemy.progress) === landing) {
              score += 100;
            }
          });
        });
    }

    options.push({ id: token.id, score });
  });

  if (!options.length) return null;

  options.sort((a, b) => b.score - a.score);
  return options[0].id;
}

function isBotTurn() {
  return (
    state.mode === "solo" &&
    state.players[state.active] !== state.humanColor
  );
}

function queueBotTurn(delay = 800) {
  if (!isBotTurn()) return;

  setTimeout(() => {
    if (
      state.phase === "playing" &&
      isBotTurn() &&
      !state.rolling &&
      !state.moving &&
      state.roll === null
    ) {
      rollDice(true);
    }
  }, delay);
}

function nextTurn() {
  const n = state.players.length;
  const done = state.finishedOrder || [];

  for (let i = 0; i < n; i++) {
    state.active = (state.active + 1) % n;
    if (!done.includes(state.players[state.active])) break;
  }

  state.roll = null;
  state.valid = new Set();

  state.message = isBotTurn()
    ? `Turno de ${playerLabel(state.players[state.active])}. El bot está pensando…`
    : "Tu turno. Lanza el dado.";

  render();
  queueBotTurn();
}

function rollDice(fromBot = false) {
  if (
    state.rolling ||
    state.moving ||
    state.roll !== null ||
    (isBotTurn() && !fromBot)
  ) {
    return;
  }

  state.rolling = true;

  if (isBotTurn()) {
 state.message = `${playerLabel(state.players[state.active])} está lanzando el dado…`;
  } else {
    state.message = "El dado está rodando…";
  }

  playSound("dice");
  render();
  setTimeout(() => {
    const n = Math.floor(Math.random() * 6) + 1;
    const color = state.players[state.active];

    state.rolling = false;
    state.lastRoll = n;
    state.roll = n;

    state.valid = new Set(
      state.tokens[color]
        .filter(token => canMove(token, n))
        .map(token => `${color}-${token.id}`)
    );
    
    if (state.valid.size === 1) {
       const onlyToken = [...state.valid][0];
       const id = Number(onlyToken.split("-")[1]);
     render();

    setTimeout(() => {
      move(color, id);
      }, 300);

     return;
 }

    if (!state.valid.size) {
state.message = `No hay movimientos válidos para ${playerLabel(color)}.`;

      render();

      setTimeout(() => {
        nextTurn();
      }, 900);

      return;
    }
    if (isBotTurn()) {
  state.message = `${playerLabel(color)} está eligiendo una ficha…`;
      setTimeout(() => {
        const tokenId = chooseBotMove(color);
        if (tokenId !== null) move(color, tokenId);
      }, 700);
      return;
    }
    state.message =
      state.valid.size === 1
        ? "Una ficha puede moverse. Tócala para jugar."
        : "Elige una ficha iluminada.";

    render();
}, 550);
}
function moveTokenDOM(color, id, progress) {
  const btn = document.querySelector(
    `.token[data-color="${color}"][data-token="${id}"]`
  );
  const pos = coord(color, progress);
  const board = document.querySelector(".board");

  if (!btn || !pos || !board) { render(); return; }

  const cell = board.children[pos[0] * 15 + pos[1]];
  if (!cell) { render(); return; }

  btn.classList.remove("stack-1", "stack-2", "stack-3");
  cell.appendChild(btn);
}

function move(color, id) {
  if (
    state.phase !== "playing" ||
    color !== state.players[state.active] ||
    state.roll === null ||
    !state.valid.has(`${color}-${id}`) ||
    state.moving
  ) {
    return;
  }

  const n = state.roll;
  const token = state.tokens[color][id];

const startProgress =
  token.progress === -1
  ? -1
  : token.progress;
  const finalProgress = token.progress === -1 ? 0 : token.progress + n;

  state.moving = true;
  state.valid = new Set();
  state.message = "Moviendo ficha…";
  render();

  let currentProgress = startProgress;

  function animateStep() {

  const nextProgress = currentProgress + 1;

  // Si ya llegamos al destino, terminamos.
  if (nextProgress > finalProgress) {
    finishMove();
    return;
  }

  currentProgress = nextProgress;

  // Movemos la ficha exactamente una casilla.
  state.tokens[color] = state.tokens[color].map(t =>
    t.id === id
      ? { ...t, progress: currentProgress }
      : t
  );
state.hop = { color, id };
    playSound("move");

  moveTokenDOM(color, id, currentProgress);

  // Pequeña pausa entre cada casilla.
  if (currentProgress < finalProgress) {
    setTimeout(animateStep, 180);
  } else {
    setTimeout(finishMove, 120);
  }
}

  function finishMove() {
    state.hop = null;
  let capturedTokens = [];

  const updated = {
    ...state.tokens,
    [color]: state.tokens[color].map(t =>
      t.id === id
        ? { ...t, progress: finalProgress }
        : t
    )
  };

  const landing = trackIndex(color, finalProgress);

  if (landing !== null && !safe.has(landing)) {
    state.players
      .filter(c => c !== color)
      .forEach(opponent => {
        updated[opponent] = updated[opponent].map(t => {
          if (trackIndex(opponent, t.progress) === landing) {
            capturedTokens.push({
              color: opponent,
              id: t.id
            });

            return {
              ...t,
              progress: t.progress,
              captured: true
            };
          }

          return t;
        });
      });
  }

  state.tokens = updated;
  trackMoveStats(color, capturedTokens.length, finalProgress);

  state.moving = false;

  /*
    Si hubo captura:
    primero mostramos la ficha siendo capturada,
    esperamos a que termine la animación
    y después la mandamos a casa.
  */
if (capturedTokens.length) {

  playSound("capture");
  render();

  // Primero mostramos claramente la captura
  setTimeout(() => {
    stopDieFlicker();
    const animations = capturedTokens.map(
      ({ color: capturedColor, id: capturedId }, index) => {

        return new Promise(resolve => {

          const piece = document.querySelector(
            `.token.captured[data-color="${capturedColor}"][data-token="${capturedId}"]`
          );

          const home = document.querySelector(
            `.home.${capturedColor} .yard`
          );

          if (!piece || !home) {
            resolve();
            return;
          }

          const pieceRect = piece.getBoundingClientRect();
          const homeRect = home.getBoundingClientRect();

          const startX =
            pieceRect.left + pieceRect.width / 2;

          const startY =
            pieceRect.top + pieceRect.height / 2;

          const endX =
            homeRect.left + homeRect.width / 2;

          const endY =
            homeRect.top + homeRect.height / 2;

          /* =========================================
             CREAR LA X / CALAVERA
             ========================================= */

          const mark = document.createElement("div");

          mark.className = "capture-mark";

          /*
             Puedes cambiar ☠ por ✕ si quieres
             una X roja en lugar de calavera.
          */
          mark.textContent = "✕";

          mark.style.left = `${startX}px`;
          mark.style.top = `${startY}px`;

          document.body.appendChild(mark);

          /* =========================================
             OCULTAR LA FICHA ORIGINAL
             ========================================= */

          piece.style.visibility = "hidden";

          /* =========================================
             CREAR FICHA QUE VIAJA A CASA
             ========================================= */

          const flyingPiece = piece.cloneNode(true);

          flyingPiece.classList.remove("captured");
          flyingPiece.classList.remove("valid");
          flyingPiece.classList.add("capture-flying");

          flyingPiece.style.position = "fixed";
          flyingPiece.style.left = `${startX}px`;
          flyingPiece.style.top = `${startY}px`;
          flyingPiece.style.width = `${pieceRect.width}px`;
          flyingPiece.style.height = `${pieceRect.height}px`;
          flyingPiece.style.margin = "0";
          flyingPiece.style.zIndex = "9999";
          flyingPiece.style.pointerEvents = "none";

          flyingPiece.style.transform =
            "translate(-50%, -50%) scale(1)";

          document.body.appendChild(flyingPiece);

          /* =========================================
             PEQUEÑO INSTANTE DESPUÉS DE LA CAPTURA
             ========================================= */

          setTimeout(() => {

            /*
              La señal desaparece antes
              de comenzar el viaje.
            */
            mark.remove();

            const animation = flyingPiece.animate(
              [
                {
                  left: `${startX}px`,
                  top: `${startY}px`,
                  transform:
                    "translate(-50%, -50%) scale(1)",
                  opacity: 1
                },

                {
                  left: `${endX}px`,
                  top: `${endY}px`,
                  transform:
                    "translate(-50%, -50%) scale(.55)",
                  opacity: .7
                }
              ],
              {
                duration: 1400,
                easing: "cubic-bezier(.35,.05,.7,1)",
                fill: "forwards"
              }
            );

            animation.finished.then(() => {

              flyingPiece.remove();

              /*
                La ficha finalmente vuelve a casa.
              */
              state.tokens[capturedColor] =
                state.tokens[capturedColor].map(t =>
                  t.id === capturedId
                    ? {
                        ...t,
                        progress: -1,
                        captured: false
                      }
                    : t
                );

              resolve();

            });

          }, 700 + index * 100);

        });

      }
    );

    Promise.all(animations).then(() => {
      continueAfterMove(finalProgress);
    });

  }, 500);

} else {

  continueAfterMove(finalProgress);

}

function validateUsername(n) {
  if (n.length < 3 || n.length > 16) return "short";
  if (!/^[A-Za-z0-9_]+$/.test(n)) return "chars";
  if (RESERVED_NAMES.includes(n.toLowerCase())) return "reserved";
  return null;
}

function avatarEmoji(id) {
  return AVATARS[id] || "👤";

function profileErrText(e, permissionMeansTaken) {
  const code = e && e.code ? e.code : "";
  if (code === "unavailable" || code === "network-request-failed") return PROFILE_MSG.net;
  if (permissionMeansTaken && code === "permission-denied") return PROFILE_MSG.taken;
  return PROFILE_MSG.generic;
}

      import(FB_BASE + "firebase-app.js"),
      import(FB_BASE + "firebase-auth.js")
    ]);
    const fbApp = appMod.initializeApp(firebaseConfig);

    fb = {

      signInWithEmailAndPassword: authMod.signInWithEmailAndPassword,
      sendPasswordResetEmail: authMod.sendPasswordResetEmail,
      sendEmailVerification: authMod.sendEmailVerification,
      signOut: authMod.signOut
    };

    try {
      const fsMod = await import(FB_BASE + "firebase-firestore.js");
      fb.db = fsMod.getFirestore(fbApp);
      fb.doc = fsMod.doc;
      fb.getDoc = fsMod.getDoc;

async function ensureUsernameDoc() {
  if (!fb || !fb.db || !state.user || !state.profile) return;
  const p = state.profile;
  const lower = (p.usernameLower || p.username || "").toLowerCase();
  if (!lower) return;
  try {
    const ref = fb.doc(fb.db, "usernames", lower);
    const snap = await fb.getDoc(ref);
    const data = { uid: state.user.uid, username: p.username, avatar: p.avatar || "a1" };
    if (!snap.exists()) await fb.setDoc(ref, data);
    else if (snap.data().uid === state.user.uid) await fb.updateDoc(ref, data);

}
